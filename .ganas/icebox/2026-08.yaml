  why_deferred: "ganas commit stage `paths` của khối trong `touches` cộng đường
    dẫn nhắc trong exit_contract (src/boundary.ts). T-046 sửa
    test/ledger.test.ts và test/ledger-chain.test.ts nhưng exit_contract chỉ
    nhắc test/module-deps.test.ts, nên hai file đó không được stage: commit
    ce78bc6 xoá export type LedgerEntry trong khi chính hai file test tại commit
    đó vẫn nhập tên ấy từ verify/ledger.js. Phải amend tay mới vào. Bỏ sót diễn
    ra IM LẶNG — commit báo thành công, gate xanh. Task nào sửa file test ngoài
    danh sách exit_contract đều dính.

    TÁI PHÁT NẶNG HƠN ở T-036, cùng ngày: commit 7bd3c88 bỏ sót BA thứ, mỗi thứ
    một đường rò khác nhau. (1) .ganas/modules/M-graph-base.yaml — task khai
    touches thiếu đúng khối này (9/10 khối core), dù việc thật sự sửa nó. (2)
    test/module-deps.test.ts — exit_contract của T-036 chỉ có `ganas validate`
    và `npm test`, không nhắc đường dẫn nào, nên không có gì để boundary.ts rút
    ra. (3) scripts/gen-ports.mjs — file mới, ngoài paths của mọi khối. Khác lần
    ce78bc6 ở chỗ hậu quả: 7bd3c88 một mình FAIL test/module-deps.test.ts (YAML
    khai 20 cạnh mới, MISSING_EDGES tại commit đó vẫn 72 dòng) — đo bằng git
    stash -u rồi chạy test tại HEAD. Nên đây không phải nợ thẩm mỹ: ganas commit
    tạo ra được commit gãy mà vẫn báo thành công.

    LẦN THỨ BA ở T-038, cùng cơ chế và ĐOÁN TRƯỚC ĐƯỢC: phiên chính đã báo trước
    khi chạy commit rằng test/module-deps.test.ts sẽ bị bỏ sót, vì exit_contract
    của T-038 cũng chỉ có `ganas validate` và `npm test` — không đường dẫn nào
    để boundary.ts rút ra. Commit 0e6408c một mình fail test/module-deps.test.ts
    đúng như dự đoán, phải amend bù. Ba lần liên tiếp (ce78bc6, 7bd3c88,
    0e6408c) trên ba task khác nhau: đây là hành vi hệ thống chứ không phải sơ
    suất từng lần. Điểm chung của cả ba: file test/ chứa tập đóng mà task PHẢI
    sửa, nhưng không exit_contract nào nhắc tên nó.

    CHẨN ĐOÁN LẠI sau khi đọc code — bản ghi trước đề xuất “bắt ganas commit
    CẢNH BÁO khi cây còn file đã đổi ngoài phạm vi”, nhưng cảnh báo đó ĐÃ TỒN
    TẠI: outsideBoundary() ở src/boundary.ts:145, gọi từ commands/gate.ts:25 và
    commands/commit.ts:175. Nó im vì hỏi NHẦM NGUỒN: commit.ts:170 lấy danh sách
    file đã sửa từ touchedPathsFor() — tức sổ phiên .ganas/state.json — chứ
    không phải git. Hai đường rò: (1) gọi CLI không kèm --session thì sessionId
    là “cli”, không khớp bản ghi nào, touched rỗng nên outsideBoundary trả rỗng;
    (2) ngay cả đúng session cũng mất, vì bindSession thay cả bản ghi khi task
    đổi (src/state.ts:63) — đo được: phiên e96d9596 ghi 0 touched_paths dù vừa
    sửa cả chục file. Nghịch lý đáng chú ý: commit.ts:87 ĐÃ dùng `git status
    --porcelain -z -uall` để dựng danh sách foreign, nhưng chỉ soi trong .ganas/
    — nên file kho tri thức lạc chỗ thì bị bắt (M-graph-base.yaml ở T-036), file
    code lạc chỗ thì lọt.

    HAI MỨC CHỮA. Mức ngay, không sửa code — khai `kind: artifact` cho file đó
    trong exit_contract: contractPathRefs() đưa c.path thẳng vào taskBoundary,
    schema đã có (src/model/task.ts:53), T-001/T-013 dùng sẵn. ĐÃ LÀM cho T-037
    và có kết quả: commit bfc6ee5 stage đủ test/module-deps.test.ts, lần đầu
    trong bốn task ganas commit không bỏ sót gì, và HEAD tự chạy test xanh. Mức
    gốc, chưa làm — đổi nguồn sự thật của outsideBoundary từ sổ phiên sang git
    status, đúng cái commit.ts:87 đã làm cho .ganas/: chỉ cần nới pathspec ra
    toàn cây. Git luôn biết file nào đổi bất kể session id, bất kể hook ghi kịp
