- id: ICE-004
  title: "Luật của ganas chỉ nằm ở .claude/rules/ — harness khác không tự nạp"
  found_at: 2026-08-20T04:00:00Z
  review_after_days: 30
  weight: 3
  ease: 2
  why_deferred: "ganas init ghi luật vào .claude/rules/*.md bất kể harness nào, mà
    thư mục đó chỉ Claude Code tự nạp. Cursor đọc .cursor/rules/*.mdc (file .md
    không frontmatter bị bỏ qua), Windsurf/Devin đọc .devin/rules/ rồi
    .windsurf/rules/ — nên dự án khai harness: cursor nhận đủ file luật mà không
    công cụ nào nạp; chúng chỉ được đọc khi file hướng dẫn trỏ tay tới. Chưa làm
    vì mỗi harness một định dạng khác nhau (Cursor cần frontmatter .mdc,
    Windsurf có trần 12.000 ký tự/file), tức là một cổng xuất riêng cho từng
    harness chứ không phải chép file — việc lớn hơn hẳn hai luật đang thêm, và
    chưa ai dùng ganas bằng Cursor để biết nó đau tới đâu."
  anchors:
    - src/commands/init.ts#L109
    - src/commands/init.ts#L126
    - .ganas/claims/C-002.yaml
  scope: P-cli
  status: open

