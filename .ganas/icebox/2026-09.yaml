- id: ICE-031
  title: npx ganas chạy bundle plugin/dist đã cũ, nên validate cây làm việc trả
    kết quả sai
  found_at: 2026-09-01T05:45:10.561Z
  review_after_days: 30
  weight: 4
  ease: 3
  why_deferred: "Trong chính repo ganas, `npx ganas <lệnh>` phân giải ra bundle đã
    build (plugin/dist/cli.js, v1.1.0) chứ KHÔNG phải cây làm việc. Sửa src/ rồi
    chạy `ganas validate` thì đang chấm bằng CODE CŨ mà không có dấu hiệu nào
    báo. Đo được ngay trong phiên 2026-09-01 lúc đóng D-013: sau khi sửa luật
    spine/design-orphaned trong src/graph/validate.ts và đóng G-001, `npx ganas
    validate` báo 13 cảnh báo mồ côi (bundle cũ), còn `npx tsx src/cli.ts
    validate` báo 1 (đúng). Chênh 12 cảnh báo, và cái sai là cái trông có thẩm
    quyền hơn. Suýt kết luận bản vá không chạy. Quy ước hiện tại chống đỡ một
    phần: có commit riêng kiểu 'Build lại plugin/dist sau chặng D-xxx' (ef5e456,
    858f009), nhưng nó chỉ chạy CUỐI chặng, trong khi cái bẫy bắn suốt lúc đang
    làm. Hướng đáng cân nhắc: cho lệnh in cảnh báo khi cwd chính là repo ganas
    mà binary đang chạy là bundle, hoặc thêm script npm `dev:validate` rồi sửa
    docs/WORKFLOW.md dùng nó. Chưa vá ngay vì chỉ hại người phát triển CHÍNH
    ganas, không hại dự án dùng ganas — nhưng weight 4 vì nó tạo kết luận sai
    một cách im lặng, đúng lớp lỗi mà dự án này sinh ra để chống."
  anchors:
    - plugin/dist/cli.js
    - plugin/.claude-plugin/plugin.json:4
  scope: P-release
  status: open
