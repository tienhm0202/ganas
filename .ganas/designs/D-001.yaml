id: D-001
title: "Tri thức neo phạm vi, mang bằng chứng chạy lại được"
serves:
  - G-001
summary: >-
  Tri thức phải neo vào một phạm vi (scope) và mang bằng chứng chạy lại được
  (probe/eval) mới được phiên sau coi là sự thật. Việc chưa quyết làm thì ghi
  vào sổ icebox riêng, không được giả làm task để có đủ serves/implements/
  exit_contract bịa ra.
exit_contract:
  # (1) Tri thức neo phạm vi + (2) không anchor thì không phải tri thức.
  # `zFact.scope`/`zClaim.scope` là trường BẮT BUỘC, `zAnchors` đòi min(1).
  - kind: command
    run: "npx tsx --test 'test/knowledge.test.ts' 'test/anchor.test.ts' 'test/anchor-issue-code.test.ts'"
    expect: exit_zero
  # (2) Khối gọi LLM phải mang eval, không được chỉ có probe cấu trúc.
  - kind: command
    run: "npx tsx --test 'test/module.test.ts'"
    expect: exit_zero
  # (3) Việc chưa quyết ghi icebox, và icebox KHÔNG bịa được thành task:
  # `zIcebox` là `.strict()` và không hề có serves/implements/exit_contract.
  - kind: command
    run: "npx tsx --test 'test/icebox-model.test.ts' 'test/icebox-validate.test.ts' 'test/icebox-cmd.test.ts'"
    expect: exit_zero
  # (2) Lớp cưỡng chế THẬT, không phải kỷ luật: hook PostToolUse chặn ghi
  # fact/claim thiếu anchor. Đây là luật duy nhất của dự án có hook chặn.
  - kind: command
    run: "npx tsx --test 'test/hooks.test.ts' 'test/hook-policy.test.ts' 'test/e2e-hook.test.ts'"
    expect: exit_zero
  # Chấm trên DỮ LIỆU THẬT chứ không chỉ trên test dựng sẵn: 8 fact và 2 claim
  # đang có trong `.ganas/` đều phải qua được chính các luật trên.
  - kind: command
    run: "npx tsx src/cli.ts validate"
    expect: exit_zero

