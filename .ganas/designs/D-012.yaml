    expect: exit_zero
  # `ganas prune` phải VẪN mặc định dry-run và vẫn không đụng sổ cái.
  - kind: command
    run: "npx tsx --test 'test/prune.test.ts' 'test/prune-locks.test.ts'"
    expect: exit_zero
  - kind: command
    run: "npm test"
    expect: exit_zero

