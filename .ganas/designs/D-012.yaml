id: D-012
title: "Vòng đời: dọn dàn giáo sau bàn giao, giữ hàng rào còn canh code"
serves:
  - G-001
summary: |-
  Chặng này trả lời câu người dùng đặt ra: release xong một phạm vi thì dữ liệu
  phục vụ việc code nên được archive, còn thiết kế thì giữ.

  Nguyên tắc đó ĐÚNG và phần lớn đã có: `src/prune.ts` phân ba tầng — tầng 1 xoá
  ephemeral local, tầng 2 ARCHIVE vào thư mục con (`tasks/done/`,
  `icebox/closed/`, proposal đã quyết), tầng 3 không bao giờ đụng
  (`verify-ledger.jsonl`, `facts/`, `claims/`, `decisions/`). Và archive cắt
  được đường nóng thật: `listYaml()` (`src/graph/load.ts`) lọc `isFile()` và
  KHÔNG đệ quy, nên file trong thư mục con biến khỏi graph mà vẫn nguyên trong
  git.

  Chỗ phải cẩn thận là TIÊU CHÍ, không phải cơ chế. Lấy "scope đã delivered" làm
  điều kiện archive CHO DESIGN thì hỏng đúng chỗ quan trọng nhất: bản vẽ của một
  phạm vi vừa bàn giao chính là bản vẽ đang canh CODE ĐANG CHẠY THẬT. Archive nó
  là gỡ hàng rào chống hồi quy đúng lúc nó bắt đầu có giá trị — từ đó ai sửa
  cũng không còn gì kêu.

  Tiêu chí đúng là "KHÔNG CÒN CANH GÌ":

  - Task và khối `agent` của nó — dàn giáo, archive được khi phạm vi
    `delivered`, không cần đợi đủ tuổi. `agent` đi theo task, không dọn riêng.
  - Design — KHÔNG BAO GIỜ archive, cùng hạng với phạm vi. Xem mục dưới: ý định
    ban đầu có archive design `superseded`, đã thử và bỏ.
  - Phạm vi, khối, fact, decision, sổ cái — tầng 3, không đụng. Sổ cái tuyệt
    đối: xoá một dòng là gãy hash-chain.

  ĐÃ THỬ VÀ BỎ: archive design `superseded` sang `designs/archived/`. Ba lý do,
  phát hiện lúc hiện thực T-077 chứ không phải lúc lập kế hoạch:

  1. Người dùng nói thẳng từ đầu là "các design sẽ được lưu lại". Archive design
     là thứ chặng này tự thêm vào, không phải điều được yêu cầu.
  2. Nó tự mâu thuẫn về mặt cơ chế. Đường DUY NHẤT để một design thành
     `superseded` là được một design khác khai `supersedes`, mà archive nó lại
     làm chính luật `spine/design-missing-supersede` (`validate.ts:278-288`)
     báo lỗi "thay thế design không tồn tại". Muốn chạy thật thì loader cộng ba
     validator phải cùng biết về một tập "đã archive" — tức hai bản đồ song
     song, đúng thứ repo này tránh.
  3. Vế "còn canh code sống" khi cài ra thì gần như luôn đúng (bản vẽ trỏ khối
     còn tồn tại), nên tính năng thành vô dụng cho mọi design có bản vẽ code.

  Cái giá của việc bỏ: `.ganas/designs/` phình dần theo số chặng. Chưa đo được
  là bao nhiêu — 12 design hiện tại chỉ vài KB. Ghi icebox, không đoán trước.

  Không strip trường nào lúc archive. `agent` hết tác dụng khi task xong, nhưng
  archive đã đưa nó ra khỏi graph rồi — xoá thêm chỉ là làm đẹp lịch sử, đổi lấy
  đúng con số không.

exit_contract:
