id: D-004
title: "Đề xuất là thực thể có phạm vi; tài liệu vùng nằm cạnh code; tham chiếu một chiều"
serves:
  - G-001
summary: >-
  ganas hiện không có chỗ hợp pháp cho câu "chỗ này lệch, nên refactor". Thư mục
  `.ganas/proposals/` được `ganas init` tạo và README mô tả là "đề xuất chờ người
  duyệt", nhưng không có schema, `graph/load.ts` không nạp, không lệnh nào ghi
  vào — nên đề xuất chỉ tồn tại trong chat và chết theo context. Hệ quả: agent
  hoặc im lặng bỏ qua chỗ lệch, hoặc tự sửa (refactor không ai duyệt). Cả hai
  đều sai.

  Dựng Proposal thành thực thể thật, theo ba ràng buộc người dùng chốt
  2026-08-21, mỗi ràng buộc quyết định một phần thiết kế:

  (1) CÁCH LY THEO PHẠM VI, NẠP KHI CẦN. Proposal bắt buộc khai `scope`. Brief
  chỉ in MỘT DÒNG ĐẾM cho proposal `pending` cùng phạm vi kèm lệnh tra — không
  bao giờ in nội dung. Đây là cùng nguyên tắc đã áp cho fact (BM25 bó theo
  scope), icebox (lọc `i.scope === t.scope`) và decision: phiên đang làm việc A
  không được nạp lịch sử của việc B, vì văn xuôi không anchor nằm sẵn trong
  context chính là nguyên liệu của ảo giác. Muốn đọc thì gọi lệnh — nạp có chủ
  ý, không nạp mặc định.

  (2) KHÔNG LỒNG GHÉP, THAM CHIẾU MỘT CHIỀU. Một proposal = một file
  `.ganas/proposals/PR-00N.yaml`, nạp bằng `collectSingle` như goal/design/task.
  Proposal KHÔNG chứa design/task lồng bên trong và design/task KHÔNG có trường
  `proposals:` trỏ ngược. Chỉ có một chiều duy nhất: `proposal.promoted_to →
  D-xxx | T-xxx | IB-xxx`. Muốn hỏi ngược "design này sinh từ đề xuất nào" thì
  duyệt proposals — cạnh ngược không được lưu, vì hai cạnh ngược nhau là hai
  nguồn sự thật lệch được.

  (3) TÀI LIỆU VÙNG NẰM TRONG THƯ MỤC CODE. Mỗi khối có thư mục gốc phải có một
  file hướng dẫn (tên theo `harness`) ĐẶT TẠI thư mục đó: khối này là gì, cổng
  vào, cách dùng, bất biến, cạm bẫy, lệnh test riêng — thứ kiểm chứng được thì
  chỉ trỏ id trong `.ganas/`. `ganas scope new` sinh sẵn khung. Cũng một chiều:
  file gốc chỉ nói khối nào ở thư mục nào, file khối không chép lại file gốc và
  không mô tả khối khác.

  Mức cưỡng chế: KHÔNG chặn cứng. Người dùng chốt ganas phải cài được lên hệ
  thống cũ có cấu trúc khác, nên chỗ lệch chỉ ra `warning` vào `ganas debt`, và
  cửa ra khi người từ chối là `rejected` có `why_rejected` (giữ lại, không xoá).
  Lớp cứng duy nhất: model KHÔNG được tự đặt `status: approved` — cùng luật đã
  áp cho decision, và có hook chặn.

  Việc chặn đường: 24 file trong `src/` chưa thuộc khối nào (`src/render/**`,
  `src/verify/**`, `src/util/*`, `src/mcp/**`, và bảy file điều phối ở gốc
  `src/`). `taskBoundary()` dựng ranh giới từ `touches`, nên task sửa
  `src/render/brief.ts` hôm nay có ranh giới RỖNG và `ganas commit` không stage
  nó. Vá bản đồ là task đầu tiên, trước mọi thứ khác.
exit_contract:
  - kind: command
    run: "npx tsx --test 'test/proposal-model.test.ts' 'test/proposal-cli.test.ts' 'test/proposal-brief.test.ts'"
    expect: exit_zero
  - kind: command
    run: "npx tsx --test 'test/validate-module-guide.test.ts'"
    expect: exit_zero
status: done
done_at: 2026-08-29T00:00:00Z
