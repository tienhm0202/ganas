notes: >-
  ĐÓNG CHẶNG 2026-08-29. Mười một task T-006..T-017 phủ cả ba vế của `summary`:
  proposal thành thực thể có schema/loader/lệnh/hook/brief, tài liệu vùng nằm
  cạnh code cho mọi khối, và bản đồ code không còn file mồ côi. Bằng chứng đóng
  chạy trên cả ba tầng của proposal cộng luật tài liệu vùng.
