id: PR-010
title: "Cạnh hợp đồng không dùng được cho khối có từ hai phụ thuộc trở lên"
scope: P-graph-core
problem: >-
  portIssues(from, to) duyệt TOÀN BỘ contract.inputs của khối đích và đòi khối nguồn phải xuất hết. Nhưng một khối bình thường nhập từ nhiều khối: M-hook-io nhập 13 cổng từ M-hook-policy và 11 cổng từ M-claim. Khai đúng sự thật thì cạnh M-claim to M-hook-io TRƯỢT với 13 lỗi kiểu M-claim không có cổng ra tên decideWriteEarly — mà M-claim đâu có nhiệm vụ cung cấp cổng đó. Hệ quả: cơ chế cạnh hợp đồng chỉ dùng được cho khối CHỈ CÓ MỘT phụ thuộc. Trong 20 khối của repo này, phần lớn có từ hai trở lên (M-verify có bốn), nên 13/14 cạnh còn lại không thể phủ được bằng cách khai trung thực. Đường vòng duy nhất hiện có là đặt optional: true cho mọi input — nhưng vòng lặp bỏ qua input optional, tức là không kiểm gì nữa, và cạnh trở thành ô đã điền.
proposed_change: >-
  Chẻ phép kiểm làm hai tầng, mỗi tầng trả lời một câu khác nhau. (1) TỪNG CẠNH kiểm GIAO: với mỗi input của đích mà nguồn CÓ cổng ra cùng tên, shape phải khớp — input không do nguồn này cung cấp thì không phải việc của cạnh này. Đó là phép bắt trôi kiểu, đúng thứ cạnh sinh ra để làm. (2) TOÀN SƠ ĐỒ kiểm PHỦ: mọi input không optional phải được ÍT NHẤT MỘT khối thượng nguồn cung cấp, nếu không thì báo nợ — luật này mới là chỗ bắt cổng mồ côi, và nó không thuộc về cạnh nào cả. Tách xong thì khai contract trung thực trở nên khả thi, và 13 cạnh còn lại mới có khuôn để theo.
