  T-042 chuyển LEDGER_FILE về graph/paths.ts và LedgerResult/LedgerEntry/LEDGER_RESULT về graph/types.ts, rồi để verify/ledger.ts TÁI XUẤT chúng (src/verify/ledger.ts:34-36) vì ganas commit chỉ stage file trong ranh giới task — sửa thẳng import của file ngoài phạm vi làm cây sắp commit không typecheck nổi. Hệ quả: boundary.ts và hooks/policy/index.ts vẫn nhập LEDGER_FILE từ verify/ledger.js, commands/trace.ts và commands/verify.ts vẫn nhập LedgerResult từ đó, nên bản đồ giữ hai cạnh M-verify -> M-cli-core và M-verify -> M-hook-policy không còn lý do nào đỡ: bốn file đó không dùng gì của M-verify ngoài mấy cái tên đã đi nơi khác. Bản đồ đang nói một điều không còn đúng, và test module-deps đếm 72 thay vì 70.
