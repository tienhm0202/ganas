- id: F-LOCK-001
  statement: >-
    `.ganas/.locks/` nằm trong LOCAL_ONLY nên không được commit và không đồng bộ
    qua git. Vì vậy lớp đặt chỗ id của `reserveId` CHỈ chống đua giữa các phiên
    trên CÙNG một máy — hai máy khác nhau (vd hai người cùng clone) vẫn có thể
    được cấp cùng một id. Va chạm đó không im lặng: hai bên ghi cùng một đường
