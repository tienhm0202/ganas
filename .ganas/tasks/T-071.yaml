notes: >-
  Bốn chỗ đăng ký: `src/commands/design.ts` → bảng `COMMANDS` VÀ khối `HELP`
  trong `src/cli.ts` → `EXPECTED_COMMANDS` trong `test/cli-help.test.ts` → mục
  `### ganas design` trong `docs/COMMANDS.md` cộng dòng ở "Bảng tra nhanh".

  `design check` chạy probe và GHI sổ cái, đúng khuôn `ganas trace` (nó cũng
  chạy lệnh rồi `recordEdgeChecks()`), nên phải có `--dry-run`. Nó làm thêm thứ
  `ganas verify` không làm được: báo lệch CẤU TRÚC từ `artifactIssues()` — port
  không tồn tại, `shape` lệch `port.shape`, bản vẽ chưa có probe.

  `design`/`show` là lệnh CHỈ ĐỌC — không được ghi đĩa. Lỗi của người dùng ném
  `GanasError`, không phải `Error`. Nhánh `default` của switch phải liệt kê các
  lệnh con CÓ THẬT.
