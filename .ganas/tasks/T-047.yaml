    - path: ".ganas/icebox/2026-08.yaml"
      why: "ICE-008 ghi chẩn đoán đầy đủ và ba lần tái phát đã đo"
    - path: "src/boundary.ts"
      why: "outsideBoundary và taskBoundary — chỗ phải đổi nguồn sự thật"
