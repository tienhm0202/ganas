notes: |-
  Task này chạy TRƯỚC mọi task auto-loop, vì câu hỏi thứ nhất đổi được hình
  dạng của T-091. Nếu Stop hook có bắn lúc sub-agent dừng thì đó là một lỗi
  ĐANG CÓ ở HEAD, không phải rủi ro tương lai — vá luôn trong task này.

  Ba câu hỏi là hành vi của harness, KHÔNG đối chiếu được bằng repo. Kết quả ghi
  thành claim (`C-003`) với anchor trỏ đúng dòng đã quan sát. Không nâng thành
  fact ở task này: fact cần `verify.run` chạy lại được, mà probe hành vi hook
  phải có một phiên Claude Code thật mới chạy được.

  Không thấy điều gì cả cũng là kết quả — ghi vào claim rằng chưa quan sát được,
  đừng để trống rồi phiên sau tưởng đã kiểm.
