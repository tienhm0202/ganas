notes: >-
  `HookInput`/`HookOutput`/`ALLOW`/`degraded` là ĐỊNH NGHĨA DỮ LIỆU thuần — hình
  dạng JSON Claude Code nhận. Chúng nằm ở vỏ chỉ vì lịch sử file, và vì thế lõi
  phải import ngược từ vỏ.

  `io/io.ts` PHẢI tái xuất mấy tên đó. `src/commands/hook.ts` (M-commands, phạm
  vi P-cli) đang import chúng từ `hooks/io/io.js`; đổi chỗ import ở đó là sửa
  khối ngoài phạm vi của task này. Tái xuất giữ toàn bộ thay đổi trong P-hook,
  và đó là cách duy nhất hợp luật.

  Điều kiện hoàn thành THẬT: `src/hooks/policy/**` không còn import gì từ
  `src/hooks/io/**`.

  `test/module-deps.test.ts` phải sửa theo: tập đóng MISSING_EDGES ngắn đi đúng
  một dòng khi chu trình đứt. File đó không thuộc khối nào (test/ nằm ngoài
  `paths`), nên nó vào ranh giới của task qua chính lệnh trong exit_contract —
  đúng cơ chế `contractPathRefs` dựng ra cho việc này.
