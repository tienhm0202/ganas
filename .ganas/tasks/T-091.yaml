notes: |-
  Nhánh chỉ chạy khi TẤT CẢ đúng: `auto_loop.enabled`, gate xanh, `pendingHuman`
  rỗng, còn task chưa done cùng `task.implements` và không bị chặn, không có cờ
  halt, và số vòng chưa chạm trần. Khi đó tăng đếm và trả `decision: block` với
  `reason` là LỆNH cụ thể (`ganas commit <id>` rồi `ganas next --session <id>`),
  kèm "vòng N/M".

  Năm điều kiện dừng cứng, mỗi cái ⇒ ALLOW + `systemMessage` nói rõ vì sao dừng:
  chạm trần; cùng một task đỏ hai lượt liên tiếp; cờ halt do T-089 đặt khi báo
  cáo có `CHẶN:`; hết task chưa done trong cùng chặng; `stop_hook_active` true.

  Dòng `:335` (`stop_hook_active` ⇒ nhả) GIỮ NGUYÊN làm phanh ngoài cùng. Đừng
  "dọn dẹp" nó cho gọn.

  `pendingHuman` khác rỗng ⇒ DỪNG. Tiêu chí `kind: manual` cần người xác nhận, và
  đây là chỗ tuyệt đối không được nới cho vòng lặp chạy mượt — nới nó là biến
  auto-loop thành đúng thứ G-002 sinh ra để chặn.

  Ranh giới chặng tính bằng quét `graph.tasks` theo `implements`. KHÔNG thêm
  trường nào: Design đã là "phase".

  Test hồi quy quan trọng nhất của cả chặng: `enabled: false` ⇒ hành vi Stop
  hook y hệt hôm nay, không lệch một byte.
