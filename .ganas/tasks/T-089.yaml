notes: |-
  Thứ tự trong handler, và thứ tự này là nội dung chính:

  1. không phải dự án ganas ⇒ ALLOW.
  2. `input.agent_id === undefined` ⇒ ALLOW.
  3. LUÔN ghi `last_assistant_message` vào `runs/notes/<session>.md` qua lõi
     `src/note.ts` — kèm `agent_type`, `agent_id`, task, sha. GHI TRƯỚC, CHẤM SAU:
     báo cáo tồi vẫn phải được giữ lại. Cắt ở trần ~8.000 ký tự và IN SỐ DÒNG ĐÃ
     BỎ (quy ước bắt buộc, `src/commands/CLAUDE.md`).
  4. thiếu tiêu đề VÀ chưa từng chặn `agent_id` này ⇒ `applyEnforcement(
     enforcementFor(config, "subagent_report"), ...)`.
  5. báo cáo có `CHẶN:` ⇒ KHÔNG chặn, đặt cờ dừng auto-loop + `systemMessage`.

  `loadGraph` chỉ gọi sau bước 2, không sớm hơn.

  Danh sách tiêu đề phải có ĐÚNG MỘT nguồn: hằng `REPORT_SECTIONS`. Task này định
  nghĩa và export nó; T-090 làm brief in ra đúng nó. Hai bản danh sách ở hai file
  là thứ lệch ngay tuần sau.

  Nói thẳng trong docstring giới hạn của hàng rào: nó cưỡng chế được sự CÓ MẶT
  của ba tiêu đề, không cưỡng chế được nội dung. Worker viết "(không có)" là qua.
  Đừng viết như thể ganas kiểm được sự thật của văn xuôi.

  Nếu T-082 phát hiện Stop hook cũng bắn lúc sub-agent dừng, phần vá `stop` đã
  nằm ở T-082 rồi — đừng vá lại lần nữa ở đây.
