context_contract:
  must_read:
    - path: "src/model/task.ts"
      why: "chỗ đặt zAgentSpec/consumes/produces; và khuôn `model` tier cho lý lẽ
        'người quyết, không suy tự động'"
    - path: "src/model/design.ts"
      why: "zDesignArtifact hiện ép `module` bắt buộc — kind `doc` cần `path` thay
