notes: |-
  Ba trường mới trên Task, mọi trường đều `.default([])`/optional để 49 task cũ
  adopt được:

  - `consumes: ArtifactRef[]` — địa chỉ bản vẽ dạng `D-010/A-x`. Đây là thứ
    thay `context_contract.must_read` cho phần hợp đồng: bơm SHAPE chứ không
    bơm đường dẫn file.
  - `produces: ArtifactRef[]` — task này sinh ra bản vẽ nào.
  - `agent?: AgentSpec` — persona, objective, steps, self_check, guardrails,
    tools. TUỲ CHỌN, chỉ điền khi thật sự giao cho sub-agent.

  KHÔNG khai `next`: suy được từ `produces` → `consumes`. Hai câu trả lời cho
  một câu hỏi thì có ngày lệch nhau.

  Bản vẽ `kind: doc`: `module` thành tuỳ chọn, thêm `path`, và `superRefine` ép
  đúng một trong hai có mặt theo kind. `artifactTargets` lấy `context` từ
  `[a.path]` với doc, `[...m.paths, ...m.entrypoints]` với các kind còn lại.

  Luật mới, cả ba đều có tiền lệ khuôn sẵn trong validate.ts:
  - `spine/task-produces-unknown-artifact` (error) — produces/consumes trỏ bản
    vẽ không tồn tại. Dùng lại `resolvesTarget()` đã có.
  - `spine/artifact-unproduced` (warning) — bản vẽ không task nào sinh ra.
  - `spine/task-produces-without-verification` (warning) — khai `produces` mà
    `exit_contract` không có `verification` trỏ vào chính bản vẽ đó. Đúng khuôn
    `spine/task-missing-verification` đã có cho `touches`.

  Mã chẩn đoán TĨNH mới phải có điểm trong `src/debt.ts` VÀ cập nhật số đếm cộng
  comment trong `test/debt.test.ts` (hiện 65) — guard đếm mã sẽ đỏ nếu quên.

  RÀNG BUỘC XẾP THỨ TỰ, giải trước khi code kẻo mất công:
  `test/no-dead-ends.test.ts` đòi MỌI trường schema mới có người đọc ngoài
  `src/model/`. `consumes`/`produces` được `validate.ts` đọc nên ổn. Nhưng các
  trường BÊN TRONG `agent` (persona, objective, steps, self_check, guardrails,
  tools) thì người đọc thật là `brief.ts` — mà `src/render/**` thuộc P-cli còn
  schema thuộc P-graph-core, nên KHÔNG ship cùng một task được.

  Cách giải, đúng khuôn `READ_VIA` mà repo đã dùng cho `enforcementFor` và
  `formatAnchor`: viết một hàm THUẦN trong `src/model/task.ts`

      export function agentDispatchLines(agent: AgentSpec): string[]

  gom toàn bộ việc đọc các trường đó thành các dòng chữ để giao việc. Rồi
  `src/graph/validate.ts` gọi nó cho một luật THẬT:
  `spine/agent-empty` (warning) — task khai `agent` mà hàm trả mảng rỗng thì bản
  giao việc không nói được gì, thà bỏ trường đi. Cuối cùng khai vào `READ_VIA`
  của `test/no-dead-ends.test.ts`: sáu trường đó → `agentDispatchLines`.

  Lợi thêm, không chỉ để qua guard: brief ở T-074 sẽ gọi CHÍNH hàm đó, nên chỉ
  có một chỗ quyết bản giao việc trông thế nào. Hai chỗ tự dựng chữ là hai bản
  sẽ lệch nhau.
