notes: >-
  Nửa sau của T-038: khai `contract.outputs` cho ba khối P-hook, phủ những cổng
  mà khối phạm vi khác nhập vào. Nhỏ nhất trong chuỗi — `M-hook-io` và `M-claim`
  gánh 14 trong 76 mục `uncovered-port` mà `ganas trace` đếm.

  Dùng `node scripts/gen-ports.mjs --scope P-hook` — nó sinh cả `outputs`.
  T-038 đã chạy lệnh này mà không phải sửa script.

  Cạm bẫy chung của gen-ports, xem notes T-049 cho ví dụ cụ thể: nó mù import
  động và `import * as X`, nên có thể KHÔNG sinh outputs cho cổng đang tồn tại.
  So tập tên cổng trước/sau, không cổng nào được biến mất.

  T-038 giữ nguyên id hai bằng chứng contract sẵn có (`V-hook-policy-to-io`,
  `V-claim-to-hook-io`) thay vì đổi sang tên máy đề xuất, để không mồ côi sổ
  cái. Giữ tiếp quy ước đó.

  Chỉ sửa YAML của ba khối trong `touches`.
