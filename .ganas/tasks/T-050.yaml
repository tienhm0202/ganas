context_contract:
  must_read:
    - path: ".ganas/modules/M-hook-policy.yaml"
      why: "Khuôn khai cổng và cạnh contract đã chạy được — chính khối này"
    - path: ".ganas/tasks/T-038.yaml"
      why: "Nửa đầu của chính việc này — đầu ĐÍCH đã khai ở đó"
  facts: []
  open_questions: []

