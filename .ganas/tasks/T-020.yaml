notes: >-
  Hiện thực PR-004. Bản rà cơ học làm việc này NHẸ hơn dự tính ban đầu:
  handlers.ts chỉ dùng đúng `stat`, nên sau T-019 nó không còn chạm syscall nào
  — phần khó còn lại chỉ là loadGraph/evaluateGate, và đó là truyền dữ liệu vào
  chứ không phải gỡ syscall.

  54 test trong test/hooks.test.ts chạy end-to-end qua sáu handler là lưới an
  toàn: refactor này KHÔNG được đổi hành vi, và test phải xanh không sửa một
  dòng kỳ vọng nào. Sửa kỳ vọng test để refactor xanh là tự tay tháo lưới.
