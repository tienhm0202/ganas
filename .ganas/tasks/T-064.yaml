notes: >-
  Số đo lúc viết task, để so lại sau khi xong: `.ganas/` có 223 file trên đĩa,
  103 trong số đó ở `.ganas/.locks/`. Đếm nội dung: 94 file `.id` và 7 file
  `.claim` mang `"session_id":"cli"`, chỉ 2 file mang UUID phiên thật. File cũ
  nhất từ 2026-08-18.

  Nguyên nhân: `releaseClaimsForSession` chỉ xoá lock có `session_id` khớp phiên
  đang kết thúc, nhưng `ganas id` gọi từ CLI rơi vào fallback `"cli"`
  (`src/commands/id.ts:264`) — một danh tính không bao giờ có `SessionEnd`. Lock
  hết TTL vẫn nằm đó vì file chỉ bị chiếm lại khi ai đó xin ĐÚNG id ấy, mà id đã
  cấp thì không ai xin lại.

  (1) Thêm dọn `.locks/` vào TẦNG 1 (`prune.ts:34-36`): xoá lock quá TTL, và
  lock của session không còn trong `state.json`. Lock `"cli"` quá TTL rơi vào cả
  hai. Cập nhật docstring tầng 1 — hiện nó liệt kê `runs/` và session mồ côi mà
  bỏ sót `.locks/`.

  RANH GIỚI: đặt logic trong `src/prune.ts`. KHÔNG sửa `src/util/lock.ts`
  (M-lock) hay `src/graph/claim.ts` (M-claim) — chúng thuộc P-graph-core và
  P-hook, sửa vào là `scope/task-touches-outside-scope`. `prune.ts` đã import
  sẵn `readState` và `listDir`/`mtimeMs`, đủ dùng.

  (2) Thêm `proposals/` vào TẦNG 2: archive proposal `approved`/`rejected` đủ
  tuổi sang `proposals/closed/`, đúng khuôn `collectClosedIceboxFiles` (dòng
  198). Sửa luôn docstring dòng 46 — lý do nó nêu ("chưa có model nào được nạp
  vào graph") sai từ v1.0.0, khi `zProposal` đã có schema, loader và sáu luật
  validate. Hiện 14/14 proposal đã ở trạng thái cuối (12 approved, 2 rejected, 0
  pending) nhưng vẫn được `loadGraph` parse ở MỌI lần chạy hook, trong khi đường
  ra duy nhất của chúng trong brief đòi `pending` (`render/brief.ts:240`).

  (3) `ganas prune --dry-run` in rõ số file SẼ archive và ngày đủ tuổi. Hiện 41
  task đã `done` vẫn nằm trong graph vì ngưỡng `DEFAULT_OLDER_THAN_DAYS = 7`
  (`src/commands/prune.ts:6`) và người dùng không có cách nào biết vì sao.

  Đo lại khi xong: `find .ganas -type f | wc -l` phải giảm khoảng 100.

  VIỆC (4) NHẬN THÊM từ T-062 (2026-08-29) — bảo vệ luật `spine/design-stalled`
  khỏi chính `prune`:

  Luật mới chỉ bắt chặng bỏ dở khi design có `total > 0` task và mọi task đều
  `done`. Vế `total > 0` là bắt buộc — thiếu nó thì một design vừa tạo chưa có
  task nào cũng bị bắt, và dòng chảy kẹt vĩnh viễn ở chặng `fix-graph`
  (`test/flow.test.ts` đã đỏ đúng thế). Nhưng `listYaml`
  (`src/graph/load.ts:93-100`) không đệ quy, còn `prune` cố ý archive task
  `done` sang `tasks/done/` để chúng rời khỏi graph. Ghép lại: một chặng đã xong
  hết task nhưng task bị archive sẽ có `total = 0` trong graph, không phân biệt
  được với chặng chưa bắt đầu.

  Đã có ca bỏ sót THẬT trên HEAD: D-003 có đúng một task T-005 (`status: done`,
  `implements: D-003`) nhưng T-005 nằm ở `.ganas/tasks/done/`, nên D-003 không
  bị bắt dù nó đúng là chặng bỏ dở. Và nó lớn dần: 41 task trong `.ganas/tasks/`
  đều đã `done`, tới ngày đủ tuổi prune sẽ archive hết.

  VIỆC: `planPrune` KHÔNG được archive task mà design của nó (`implements`) chưa
  `done`. Khuôn bảo vệ đã có sẵn ngay cạnh — `prune.ts:171-172` đã giữ lại task
  còn bị `blocked_by` trỏ tới và task bị `promoted_to` trỏ tới; thêm một điều
  kiện cùng chỗ là xong. Ngữ nghĩa cũng đúng hơn: task của một chặng chưa đóng
  vẫn là bằng chứng sống, chưa phải đồ lưu trữ.

  Mức chữa GỐC (cho loader đệ quy vào `tasks/done/`) nằm ở `src/graph/load.ts`,
  khối M-load, phạm vi P-graph-core — ngoài task này. Đã ghi ICE-021.
