notes: |-
  `role: z.enum(["design","build"]).default("build")` — mặc định `build` để 49
  task hiện có adopt được mà không sửa file nào.

  Hai luật:

  - `spine/design-task-touches-code` (error) — `role: design` mà `touches` khác
    rỗng. Vẽ và xây trong cùng một task thì không ai chấm được bản vẽ trước khi
    code chạy theo nó.
  - `spine/design-task-without-artifact-criterion` (warning) — `role: design`
    thiếu tiêu chí `kind: artifact` trỏ file design của nó. Đây là thứ làm
    `taskBoundary` khác rỗng: `contractPaths()` (`src/boundary.ts:50-56`) nhặt
    `c.path` kể cả path trong `.ganas/` — tiền lệ `.ganas/tasks/done/T-006.yaml`.
    Không có nó thì ranh giới rỗng, và `outsideBoundary` rơi vào nhánh "rỗng ⇒
    không kết luận gì", tức task thiết kế sửa code mà không ai báo.

  KHÔNG sửa `taskBoundary()`. Nó cố ý không trả `.ganas` (docstring `:145-147`),
  và `ownsGanasFile()` đã cho task sở hữu file design nó `implements`.

  Bài học ghi lại: danh sách gạch đầu dòng KHÔNG được đặt trong `>-` (folded) —
  YAML gấp mọi dòng thành một đoạn, và lần đầu một lệnh ganas ghi lại file thì
  cấu trúc biến mất vĩnh viễn. Dùng `|-` (literal) cho mọi notes có danh sách.
