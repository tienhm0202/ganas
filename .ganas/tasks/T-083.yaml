context_contract:
  must_read:
    - path: "plugin/skills/plan-to-tasks/SKILL.md"
      why: "frontmatter `allowed-tools` hiện KHÔNG có `Read`, nên skill không mở được
        file plan — đây là điểm hỏng thật, không phải hình thức"
  facts: []
  open_questions: []

touches: []

exit_contract:
  - kind: artifact
    path: "plugin/skills/plan-to-tasks/SKILL.md"
    must_contain: "đường dẫn file plan"
  - kind: command
    run: "npm test"
    expect: exit_zero

notes: |-
  Ba sửa đổi, không hơn:
  1. `allowed-tools` thêm `Read`.
  2. `description`/`when_to_use` hiện KHẲNG ĐỊNH "không cần đọc lại file nào" —
     câu đó sẽ SAI sau thay đổi, phải sửa chứ không phải thêm câu mới bên cạnh.
  3. Một bước 0: được đưa đường dẫn ⇒ `Read` toàn bộ file trước, nội dung file
     thay cho context Plan Mode; vừa duyệt qua ExitPlanMode ⇒ bỏ qua bước này;
     KHÔNG tự đi tìm file plan khi không ai đưa đường dẫn.

  Cộng một câu ở mục 5: gán `commit_type` cùng lúc với `model`.

  `touches: []` vì `plugin/skills/**` không nằm trong `paths` của khối nào —
  cùng ca với `test/` ở ICE-017/ICE-022. Tiêu chí `artifact` là thứ duy nhất kéo
  file vào ranh giới của `ganas commit`.

  KHÔNG chạm mục 3 và mục 5 phần tier model: đó chính là thứ làm `ganas brief`
  đủ rõ cho Sonnet/Haiku, và nó đang đúng.
