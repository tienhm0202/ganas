notes: >-
  Hiện thực PR-008. CHỈ sửa file test, không đụng code sản phẩm — rủi ro hồi quy
  gần như bằng không, và đó là lý do task này tách khỏi chuyện anchor lỏng
  (chuyện kia đụng src/model/anchor.ts).

  `READ_VIA` KHÔNG phải danh sách miễn trừ. Nó là lời khai "trường này đọc qua
  accessor nào", và test phải kiểm cả ba vế của lời khai: accessor có thật và
  được export từ src/model/; trường xuất hiện trong file khai accessor; accessor
  được gọi từ NGOÀI src/model/. Thiếu vế thứ ba thì trường vẫn chết, chỉ chết
  chậm hơn một tầng.

  Đo trước khi làm (2026-08-23): nới regex chỉ nổ đúng hai trường —
  `enforcement` và `enforcement_rules`. `build_check` đã có người đọc thật sau
  T-028 nên tự hết, không cần khai gì.

  Nếu sau này regex bắt nhầm khoá trong object literal của `.default(...)`, cách
  sửa KHÔNG phải nhét vào EXEMPT mà là dạy phép trích bỏ qua thân
  `.default(...)`. Ghi câu này ngay cạnh regex.
