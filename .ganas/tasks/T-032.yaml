notes: >-
  Tầng 1 — TỪNG CẠNH kiểm GIAO: chỉ so những input mà khối nguồn CÓ cổng ra cùng
  tên. Input không do nguồn này cấp thì không phải việc của cạnh này.

  Tầng 2 — TOÀN SƠ ĐỒ kiểm PHỦ: mọi input không `optional` phải được ít nhất một
  khối trong `depends_on` cấp; thiếu thì sinh nợ `uncovered-port`.

  Bỏ tầng 2 là làm hỏng cả bản vá: chỉ kiểm giao mà không kiểm phủ thì một cổng
  KHÔNG AI cấp sẽ im lặng lọt qua mọi cạnh — đúng lỗ mà tầng 1 vừa mở ra.

  Test phải có ca "khối hai phụ thuộc, mỗi khối cấp một nửa cổng" — chính ca làm
  T-031 phải dừng. Không dựng lại được ca đó thì bản vá chưa chứng minh được gì.
