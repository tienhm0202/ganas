id: T-057
title: "Probe nghiệm thu luồng ghép của P-graph-core phải kiểm luồng thật, không
  phải npm test"
serves:
  - G-001
implements: D-007
scope: P-graph-core
status: done
estimated_context: small
model: verifier

context_contract:
  must_read:
    - path: ".ganas/scopes/P-graph-core.yaml"
      why: "Chỗ khai probe đang chạy lệnh chung chung"
    - path: "test/flow.test.ts"
      why: "Khuôn dựng project tạm và chạy CLI thật đầu-cuối"
  facts: []
  open_questions: []

