    run: "npx tsx --test 'test/e2e-graph-core.test.ts'"
  - kind: command
    run: "npx tsx src/cli.ts validate"
  - kind: command
    run: "npm test"
  - kind: artifact
    path: "test/e2e-graph-core.test.ts"
