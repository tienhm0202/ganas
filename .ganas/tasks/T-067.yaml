context_contract:
  must_read:
    - path: "src/boundary.ts"
      why: "`taskBoundary()` dòng 68-76 gộp `module.paths` với `contractPaths(task)`;
        `looksLikePath`/`contractPaths` ngay trên đó đã là bộ rút đường dẫn từ
        chuỗi lệnh, dùng lại chứ đừng viết bộ thứ hai"
    - path: ".ganas/icebox/2026-08.yaml"
      why: "ICE-017 ghi đủ hiện tượng và ba lần vấp; task này là mức chữa gốc của nó"
  facts: []
  open_questions: []

