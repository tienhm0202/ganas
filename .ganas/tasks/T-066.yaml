notes: >-
  `task_link` được khai ở `ENFORCEMENT_RULES` (`src/model/config.ts:25`), tài
  liệu hoá ở `docs/START.md:136` và `docs/CONCEPTS.md:203`, in trong template
  `config.yaml` mà `ganas init` sinh ra (`src/templates/project.ts:37`) — nhưng
  `grep -rn "task_link" src/` cho thấy KHÔNG code nào gọi
  `enforcementFor(config, "task_link")`. Người dùng bỏ dấu `#` để bật nó trong
  `config.yaml` sẽ không có gì xảy ra, và không có cách nào biết.

  Đây đúng thứ ganas sinh ra để chống — một lời hứa được trình như sự thật — chỉ
  khác là lần này do chính ganas gây ra.

  Chữa bằng NỐI DÂY, không phải gỡ. `ruleForDiagnostics` hiện là một biểu thức
  hai nhánh; thêm nhánh thứ ba: diagnostic mang mã liên kết task
  (`spine/task-missing-goal`, `spine/task-missing-design`,
  `spine/task-goal-not-in-design`, `scope/task-scope-not-found`,
  `scope/task-touches-outside-scope`) thì cả lượt tính theo `task_link`. Giữ đúng
  nguyên tắc đã ghi trong docstring hàm đó: luật NẶNG hơn thắng — `knowledge_anchor`
  vẫn đứng trước.

  Vì sao không gỡ: gỡ phải sửa `src/model/config.ts` (M-model, P-graph-core),
  `src/templates/project.ts` (M-templates, P-cli) và hai file docs — ba scope
  trong một task, vi phạm `scope/task-touches-outside-scope`. Nối dây nằm trọn
  trong `src/hooks/policy/**`. Và luật này có ích thật: nó cho phép nới riêng
  phần liên kết spine mà vẫn giữ chặt `knowledge_anchor`.

  Test mới phải khẳng định `ruleForDiagnostics` trả `"task_link"` cho một
  diagnostic mã `spine/task-missing-design`, và vẫn trả `"knowledge_anchor"` khi
  lượt đó có lẫn một lỗi anchor. Đỏ với code hiện tại.
