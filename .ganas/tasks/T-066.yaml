context_contract:
  must_read:
    - path: "src/hooks/policy/index.ts"
      why: "`ruleForDiagnostics` (dòng 281-283) chỉ trả `knowledge_anchor` hoặc `schema` — hai trong năm luật; đây là chỗ `task_link` phải được nối vào"
    - path: "src/model/config.ts"
      why: "`ENFORCEMENT_RULES` dòng 17-28 — ĐỌC để biết `task_link` được định nghĩa là gì ('tạo/đóng task không neo được vào phạm vi/goal'); KHÔNG sửa, file này thuộc M-model / P-graph-core"
    - path: "src/graph/validate.ts"
