id: T-060
title: "Khai bằng chứng contract cho cạnh M-lock → M-claim ở đầu nguồn"
serves:
  - G-001
implements: D-007
scope: P-graph-core
status: todo
estimated_context: small
model: scribe

context_contract:
  must_read:
    - path: ".ganas/tasks/T-059.yaml"
      why: "Nửa đầu — cạnh và cổng khai ở đầu đích tại đó"
    - path: ".ganas/modules/M-hook-policy.yaml"
      why: "Khuôn khai bằng chứng kind: contract đã chạy được"
  facts: []
  open_questions: []

touches:
  - M-verify

exit_contract:
  - kind: command
    run: "npx tsx src/cli.ts validate"
  - kind: command
