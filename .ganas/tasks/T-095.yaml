  ## Đã đo trước cái giá, đừng đo lại

  Sửa xong, phép trích thấy 134 tên thay vì 112 — lộ thêm 22. Phần lớn có người
  đọc thật nên tự pass. Hai cái phải xử lý ĐÚNG CÁCH:

  - `invalid_type_error`, `required_error` — khoá của object tuỳ chọn zod
