    chúng ra. Nhét vào `EXEMPT` là sai, và comment trong file đã cảnh báo đúng
    ca này bằng đúng chữ đó.

  Trường nào lộ ra mà THẬT SỰ không ai đọc thì đó là một phát hiện, không phải
