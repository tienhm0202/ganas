id: T-081
title: "Bằng chứng chứng tại commit đã rời lịch sử thì hết hiệu lực — nối dây
  trường `git` của sổ cái"
serves:
  - G-002
implements: D-014
scope: P-graph-core
status: done
estimated_context: medium
model: verifier

context_contract:
  must_read:
    - path: "src/verify/ledger.ts"
      why: "dòng 292 ghi trường `git`; cần biết nó ghi dạng short sha để phép tra tổ
        tiên dùng đúng dạng"
    - path: "src/graph/freshness.ts"
      why: "mô hình độ tươi đang chạy — commit chỉ THÊM một lý do hết hiệu lực, không
        thay `depends_on`/`ttl_days`"
  facts: []
  open_questions: []

touches:
