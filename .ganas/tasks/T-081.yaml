  # `decide()`/`computeFreshness()` ở `src/graph/freshness.ts` là nơi trạng thái
  # commit được ĐỌC — khai thiếu khối này thì file đó nằm ngoài ranh giới và
  # `ganas commit` bỏ lại đúng nửa việc.
  - M-freshness

exit_contract:
  - kind: command
    run: "npx tsx --test 'test/ledger-commit.test.ts'"
    expect: exit_zero
