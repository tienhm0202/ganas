notes: |-
  Ba trạng thái, KHÔNG PHẢI hai — gộp lại là chỗ hỏng của cả tính năng:

    1. commit có trong lịch sử của HEAD  → bằng chứng còn hiệu lực
    2. commit repo BIẾT nhưng không phải tổ tiên → hết hiệu lực (rebase/amend/đổi nhánh)
    3. commit repo KHÔNG BIẾT (clone nông, đã gc, chưa fetch) → IM LẶNG bỏ qua

  Ca 3 fail open có chủ ý. Gộp 3 vào 2 thì mọi clone nông đỏ rực, và hàng rào
  đỏ oan là hàng rào bị tắt — chính lý lẽ mà `src/graph/validate.ts` đã dùng để
  bỏ luật khối mồ côi một chiều, và mà `.ganas/modules/M-validate.yaml` dùng để
  khai cổng bằng nhãn loại thay vì chép nguyên thân kiểu.

  Test phải phủ cả ba ca bằng repo git tạm dựng trong test, không phải bằng
  chính repo này — chấm trên repo thật thì kết quả đổi theo lịch sử máy chạy.

  Gọi git nằm trong `M-verify` (`nature: io`) nên không phá luật kiến trúc.
  ĐỪNG đưa phép gọi này vào `validateGraph()` — hàm đó thuần, nhận graph trả
  diagnostic; nhét shell vào là biến lõi thành vỏ.
