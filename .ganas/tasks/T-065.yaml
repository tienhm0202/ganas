notes: >-
  `isAnchorIssue` hiện là:

      return d.message.includes("anchor") || d.message.includes("bằng chứng");

  Khớp chuỗi trên thông điệp lỗi TIẾNG VIỆT. Hệ quả: sửa câu chữ `NEED_ANCHOR`,
  dịch thông điệp, hay thêm dấu — luật anchor lặng lẽ tụt hạng xuống `schema` và
  hook không còn chặn theo `knowledge_anchor` nữa. Không test nào bắt được, vì
  test hiện truyền thẳng diagnostic đã có sẵn chữ "anchor" vào hàm.

  Đây là luật cưỡng chế QUAN TRỌNG NHẤT của ganas
  (`.claude/rules/ganas-knowledge.md`: "luật duy nhất có hook chặn"), đang được
  phân loại bằng thứ dễ vỡ nhất.

  Test mới phải khoá đúng lỗ đó: dựng một diagnostic anchor mà THÔNG ĐIỆP không
  chứa chữ "anchor" lẫn "bằng chứng" — nó vẫn phải được phân loại là
  `knowledge_anchor`. Test đó đỏ với code hiện tại.

  Việc nhỏ, ranh giới rõ, có test dẫn đường → tier `scribe`. Chỉ sửa
  `src/hooks/policy/**`; khối này là `nature: code` thuần, KHÔNG được import gì
  chạm đĩa (`test/module-nature.test.ts` sẽ đỏ) và không import gì từ `../io/`,
  kể cả kiểu.

  ĐÃ QUYẾT (2026-08-29), câu hỏi mở này khép lại — đọc trước khi sửa:
  `issuesToDiagnostics` (`src/graph/load.ts:36-43`) sinh `code:
  schema/${issue.code}`, nên lỗi anchor mang mã `schema/too_small`, không phân
  biệt được với mọi lỗi `.min()` khác. Tín hiệu CÓ CẤU TRÚC nằm ở `issue.path
  === ["anchors"]`, và nó đi vào `message` dưới dạng tiền tố `"anchors: …"`
  (hoặc `"anchors.0: …"` khi một anchor sai định dạng).

  Phương án SẠCH NHẤT là gắn mã riêng (`knowledge/anchor-missing`) ngay trong
  `issuesToDiagnostics`. KHÔNG làm ở task này: `load.ts` thuộc M-load / phạm vi
  P-graph-core, đụng vào là `scope/task-touches-outside-scope`.

  Làm trong phạm vi P-hook: khớp theo TÊN TRƯỜNG, không theo văn xuôi. Tức là
  bắt tiền tố đường dẫn `anchors` ở đầu `message`, thay cho `includes("anchor")
  || includes("bằng chứng")`. Lý do đây là cải thiện thật chứ không phải đổi một
  chuỗi lấy chuỗi khác: `anchors` là ĐỊNH DANH trong schema, và
  `.claude/rules/naming.md` bảo đảm định danh không bao giờ được dịch sang tiếng
  Việt — còn thông điệp lỗi thì được phép viết lại bất cứ lúc nào. Nếu ai đổi
  tên trường `anchors` trong `zClaim`/`zProposal` thì schema đổi theo và test đỏ
  ngay, đó là điều kiện an toàn mà cách cũ không có.

  Chỉ khớp `"anchor"` trần thì bắt nhầm mọi message tình cờ chứa chữ đó; phải
  neo vào ĐẦU chuỗi, vì `message` luôn mở đầu bằng `issue.path.join(".")`.

  BỔ SUNG exit_contract sau khi làm (2026-08-29), nói rõ vì sao — đây là SIẾT,
  không phải nới: task này phải sửa `test/hook-policy.test.ts` vì hai ca trong
  đó dựng message giả ("thiếu anchor", "thiếu bằng chứng") không theo định dạng
  mà `issuesToDiagnostics` thật sự sinh ra (`<path>: <message>`), nên chúng
  không còn kiểm được điều đang khẳng định. Nhưng `taskBoundary()` chỉ gộp
  `module.paths` với đường dẫn CÓ TRONG `exit_contract`, và probe của
  `V-hook-policy-pure` — vốn chạy đúng file test đó — KHÔNG được quét. Hệ quả:
  `ganas commit` bỏ file ấy lại working tree, và `npm test` trên HEAD sẽ đỏ vì
  test cũ chạy với code mới. Thêm tiêu chí `command` chạy chính file đó vừa kéo
  nó vào ranh giới, vừa bắt nó phải xanh.
