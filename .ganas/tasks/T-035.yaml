  sai chiều, M-render→M-workflow lỗi thời.

  VẾ 1 (import thật phải có `depends_on`) khai TẬP ĐÓNG 67 mục. KHÔNG thêm 66
  cạnh vào graph: mỗi cạnh mới đẻ một `uncovered-edge`, tức 67 hợp đồng phải
  khai — việc đó lớn hơn hẳn và phải do người quyết. Tập đóng giữ cho nó không
  phình, và ai dọn được mục nào thì xoá mục đó.

  Phép quét PHẢI tính cả `import()` động: `cli.ts` nạp lệnh và `flow.ts` nạp
  `boundary.js` đều bằng đường đó. Bỏ sót thì hai cạnh đúng bị báo oan là "không
  import nào đỡ" — tôi đã vấp đúng chỗ này lúc đo.
