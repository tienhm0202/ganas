notes: |-
  `touches: []` có chủ đích: tài liệu và skill không nằm trong `paths` của khối
  nào, nên không có nghĩa vụ verification nào để khai. Ranh giới của task này
  đến từ các tiêu chí `kind: artifact` ở trên — đó cũng là cách DUY NHẤT kéo
  `docs/` và `plugin/skills/` vào ranh giới, xem nhánh rò (b) trong icebox.

  Skill `design` viết theo khuôn `plugin/skills/scope/SKILL.md`: frontmatter có
  `name`/`description`/`when_to_use`/`allowed-tools`, mở đầu bằng một lệnh
  `!` gọi `ganas design`, rồi giải thích VÌ SAO bản vẽ tồn tại — không chép lại
  luật gốc.

  Đừng viết dài. `docs/CONCEPTS.md` là tham chiếu được phép dài; SKILL.md thì
  không — nó nạp vào context mỗi lần skill được gọi.
