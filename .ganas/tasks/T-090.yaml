notes: |-
  Gom vào một task vì tất cả đều ở P-cli và đều là "nối dây cho thứ T-089 vừa làm":
  `plugin/hooks/hooks.json` (6 → 7 sự kiện), dòng `"subagent-stop"` trong
  `src/commands/hook.ts`, mẫu `config.yaml` của `ganas init`
  (`src/templates/project.ts`) có hai khối mới kèm chú thích "mặc định tắt", và
  hai khối chữ trong `dispatchSection()`.

  Khối mẫu báo cáo in ra ĐÚNG `REPORT_SECTIONS` mà T-089 export — import hằng đó,
  đừng gõ lại danh sách.

  Khối auto-loop chỉ in khi `auto_loop.enabled`: gate xanh → `ganas commit` →
  `ganas next` → giao sub-agent kế → dừng khi hết task trong chặng. Đây mới là
  vòng lặp THẬT; nhánh Stop hook ở T-091 chỉ mồi lại một nhịp.

  Bốn chỗ văn bản nói "sáu hook / sáu thời điểm" phải sửa, nếu không tài liệu nói
  sai ngay ngày hook thứ bảy chạy: `docs/INSTALL.md`, `docs/FLOWS.md`,
  `docs/WORKFLOW.md`, `src/hooks/io/CLAUDE.md`.

  `scripts/install-target.mjs` đọc thẳng `hooks.json` nên KHÔNG có bản chép thứ
  hai phải đồng bộ — kiểm lại điều này trước khi đi tìm chỗ khác để sửa.
