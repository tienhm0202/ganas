notes: |-
  Quan sát thật ngày 2026-09-05, năm task liên tiếp: phiên bind T-080, chấm gate
  T-083/T-084/T-089/T-090/T-092, lần nào cũng ra "cả phiên không có lượt sửa nào
  từ sub-agent" — trong khi `state.json` ghi `subagent_touched: true` và sub-agent
  đúng là đã làm.

  Chỗ sai KHÔNG nằm ở `subagentTouchedFor`. Hàm đó gắn theo cặp (session, task)
  có chủ ý. Chỗ sai là nơi gọi: phát một cảnh báo mà tiền đề của nó không đúng.

  Hướng chữa rẻ nhất: chỉ phát cảnh báo khi task đang chấm ĐÚNG LÀ task phiên
  bind vào. Task đi ngang thì im — ganas không biết gì về việc giao sub-agent
  cho task đó, và "không biết" phải im chứ không được đoán.

  Cân nhắc hướng thứ hai trước khi chọn, rồi ghi lý do vào docstring: cho cờ
  gắn theo task mà sub-agent THẬT SỰ sửa, chứ không theo task đang bind. Đắt
  hơn và đụng `state.json`; chỉ chọn nếu hướng một để lọt một ca thật.

  Luồng 1.2.0 làm ca này thành thường trực: auto-loop có phiên chính điều phối
  nhiều task, nên cảnh báo sai sẽ nổ mỗi vòng lặp. Cảnh báo sai nguy hiểm hơn
  không có cảnh báo — nó dạy người đọc bỏ qua, và đúng lúc nó kêu thật thì
  không ai nhìn nữa.

  Đừng đổi hành vi khi task chấm ĐÚNG là task bind: ca đó cảnh báo vẫn phải nổ
  y như hôm nay. Test phải phủ cả hai chiều.
