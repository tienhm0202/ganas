  - kind: command
    run: "npx tsx --test 'test/debt.test.ts'"
  - kind: command
    run: "npx tsx src/cli.ts validate"
  - kind: command
    run: "npm run typecheck"

  - kind: verification
    target: "M-model/V-model-smoke"
  - kind: verification
    target: "M-graph-read/V-graph-read-trace"
  - kind: verification
    target: "M-load/V-load-smoke"
  - kind: verification
    target: "M-validate/V-validate-smoke"

notes: >-
  Bắt buộc: id (PR-00N), title, scope, problem, anchors không rỗng,
  proposed_change, status (pending|approved|rejected|superseded), weight/ease
  cùng thang DebtScore, found_at. approved đòi decided_by + decided_at; rejected
  đòi why_rejected. promoted_to là cạnh MỘT CHIỀU tới D-/T-/IB-; không thêm
  trường ngược ở design/task. Validate: promoted_to phải trỏ thực thể có thật,
  hai proposal không được cùng promoted_to, scope phải tồn tại.
