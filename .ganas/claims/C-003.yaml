  notes: >-
    CỐ Ý là claim, không phải fact: hai nửa khác hẳn nhau về loại bằng chứng.
    Nửa REPO (hooks.json không có khoá SubagentStop, HANDLERS không có khoá
    subagent-stop, preToolUse/postToolUse đã có fromSubagent mà stop thì
    chưa, stop_hook_active là short-circuit đầu tiên của stop) là bằng chứng
    CODE thật, và `scripts/probe-subagent-hooks.sh` giữ nó KHÔNG TRÔI: probe
    (a) fail nếu ai thêm khoá SubagentStop mà không đọc claim này; probe (b)
    fail nếu `agent_id` bắt đầu đổi quyết định của `stop()` (vd ai thêm nhánh
    agent_id mà quên cập nhật claim); probe (c) fail nếu stop_hook_active hết
    là short-circuit đầu tiên. Cả ba đều exit khác 0 khi giả định trôi — đúng
    tinh thần "ngày hook đổi hành vi thì probe đỏ" của probe-hook-ignores-locks.sh.

    Nửa TÀI LIỆU (schema thật của SubagentStop, decision:block có làm sub-agent
    chạy tiếp thật không, stop_hook_active còn true bao lâu sau một block) là
    hành vi HARNESS — không probe nào trong sandbox này chạm tới được, vì
    không có cách bắt Claude Code CLI thật gửi một sự kiện SubagentStop rồi đọc
    JSON nó gửi (không tìm thấy log hook nào trong sandbox, và cấu hình hook
    được nạp một lần lúc phiên khởi động nên không tự thêm SubagentStop giữa
    phiên để quan sát). Ba câu hỏi mở gốc của T-082:

    (1) "Stop hook có bắn khi sub-agent kết thúc không?" — TRẢ LỜI ĐƯỢC một
    phần bằng repo: KHÔNG, vì SubagentStop chưa được đăng ký ở đâu cả nên
    `stop` không được gọi qua đường đó. Phần "nếu có đăng ký thì có tách biệt
    session_id hay không" vẫn CHƯA QUAN SÁT ĐƯỢC trực tiếp — suy ra gián tiếp
    từ việc preToolUse/postToolUse dùng chung session_id cho tool-call từ
    sub-agent.

    (2) "stop_hook_active có còn true ở lượt Stop kế sau một decision:block
    không?" — CHƯA QUAN SÁT ĐƯỢC. Tài liệu chỉ nói field này "true nếu Stop
    hook trước đã giữ Claude chạy tiếp", không nói rõ nó tắt lại NGAY LƯỢT KẾ
    TIẾP hay có thể còn true nhiều lượt. Không tìm thấy ví dụ JSON cụ thể nào
    trong tài liệu đã đọc để khẳng định.

    (3) "SubagentStop có nhận stop_hook_active không, và decision:block có
    thật khiến sub-agent chạy tiếp không?" — TRẢ LỜI ĐƯỢC bằng tài liệu (có,
    và có — xem anchors url ở trên), nhưng CHƯA quan sát được bằng một lượt
    chạy thật trong CHÍNH harness Claude Code CLI (bằng chứng đến từ trang
    Agent SDK + một gist bên thứ ba, không phải một log hook thật đã bắt
    được). Mâu thuẫn "block vs continue|stop" mà brief nhắc tới KHÔNG xuất
    hiện trong hai trang đã đọc — có thể tài liệu đã được Anthropic sửa từ
    lúc brief được viết, hoặc mâu thuẫn nằm ở một trang khác chưa đọc tới;
    ghi lại là chưa loại trừ được, không phải đã xác nhận hết mâu thuẫn.

    Đường tốt nghiệp lên fact: không có, vì "SubagentStop" cần một phiên
    Claude Code thật kích hoạt được sự kiện đó để bắt JSON gửi vào — không có
    lệnh nào trong repo dựng lại được điều đó một cách tất định.
