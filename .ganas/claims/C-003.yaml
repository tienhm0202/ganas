- id: C-003
  statement: >-
    Ở HEAD hiện tại, `handlers.stop` (src/hooks/io/handlers.ts:332) KHÔNG bị
    harness gọi khi một sub-agent kết thúc — không phải vì code kiểm agent_id
    (nó không kiểm), mà vì plugin chưa đăng ký hook nào cho sự kiện
    `SubagentStop` ở bất kỳ chỗ nào trong hai chỗ phải khớp nhau: manifest
    `plugin/hooks/hooks.json` chỉ có khoá `Stop` (dòng 35), không có
    `SubagentStop`; và bảng lệnh CLI `src/commands/hook.ts` (HANDLERS, dòng
    14-19) chỉ ánh xạ `stop: handlers.stop`, không có khoá `subagent-stop`
    nào. Tài liệu Claude Code (cả CLI lẫn Agent SDK) mô tả `Stop` và
    `SubagentStop` là HAI sự kiện tách biệt ("khi Claude chính kết thúc lượt"
    so với "khi một sub-agent kết thúc"), và harness chỉ gọi lệnh đã khai cho
    ĐÚNG tên sự kiện đó — nên giả định nêu trong context_contract của T-082
    ("Stop hook chấm gate bằng session của phiên cha lúc sub-agent dừng") KHÔNG
    phải một lỗi đang có ở HEAD. Nó CHỈ trở thành lỗi thật nếu sau này có ai
    thêm khoá `SubagentStop` vào hooks.json trỏ thẳng về handler `stop` hiện
    tại (hoặc một handler mới tái dùng cùng logic) mà quên nhánh agent_id — lúc
    đó bản vá `if (input.agent_id !== undefined) return ALLOW;` mới cần thiết.
    Vì lý do đó, task T-082 KHÔNG áp bản vá này vào `stop()`.

    Đáng chú ý: hai hàm hàng xóm của `stop` — `preToolUse` (handlers.ts:219) và
    `postToolUse` (handlers.ts:285) — ĐÃ tính `fromSubagent = input.agent_id
    !== undefined` và dùng nó (markTouched, pendingDispatchNudge). `state.ts`
    còn có hẳn field `subagent_touched` (state.ts:298) để nhớ lại "phiên này có
    lượt sửa nào từ sub-agent không" — nghĩa là một tool call từ sub-agent VẪN
    dùng chung `session_id` với phiên chính, chỉ khác ở có thêm `agent_id`.
    Đây là dữ kiện REPO (không phải suy đoán về harness): nếu SubagentStop có
    khớp cùng session_id với Stop của phiên cha (nhiều khả năng, vì cùng cơ chế
    "agent_id thêm vào" áp dụng cho PreToolUse/PostToolUse), thì việc `stop`
    chưa có nhánh agent_id vẫn là một cạm bẫy CÓ THẬT đang chờ, chỉ chưa bị
    kích hoạt vì chưa ai nối dây `SubagentStop`. Đây chính là thứ đổi hình dạng
    của T-091 theo ghi chú trong brief: T-091 (khi thêm SubagentStop để bắt
    báo cáo sub-agent) phải quyết định dùng handler MỚI (không phải `stop` tái
    sử dụng), hoặc nếu tái dùng thì bắt buộc thêm nhánh agent_id lúc đó.

    Về bản thân sự kiện SubagentStop (tài liệu bên ngoài repo, KHÔNG quan sát
    được bằng cách chạy gì trong sandbox này — xem "chưa quan sát được" ở
    dưới): theo tài liệu Agent SDK của Anthropic, `agent_id`/`agent_type` là
    field BẮT BUỘC (required) trên SubagentStop (khác PreToolUse/PostToolUse,
    nơi chúng chỉ optional), và ví dụ code mẫu của chính tài liệu đọc
    `input_data.get('stop_hook_active')` bên trong một SubagentStop hook —
    tức input schema của SubagentStop CÓ field `stop_hook_active`, cùng cấu
    trúc với Stop ("Same structure and semantics as Stop" theo bảng tổng hợp
    hooks). Về `decision: "block"`: bảng "exit code 2 behavior" của tài liệu
    Claude Code CLI ghi rõ SubagentStop "Yes — Prevents the subagent from
    stopping", tức về mặt tài liệu, `block` ở SubagentStop khiến sub-agent
    CHẠY TIẾP thay vì dừng — cùng cơ chế với `block` ở Stop khiến phiên chính
    chạy tiếp.
