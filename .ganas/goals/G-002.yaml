id: G-002
title: "Hàng rào không xanh được khi nó chưa kiểm gì"
outcome: >-
  Không hàng rào cơ học nào của ganas báo đạt trong khi nó thực ra không kiểm
  được gì — và mỗi bằng chứng biết nó được chứng tại commit nào, nên bằng chứng
  ghi trên một commit đã biến khỏi lịch sử thì không còn được tính.

# Hai tiêu chí, cả hai ĐANG ĐỎ tại HEAD hôm nay — đó là điều kiện để chúng có
# nghĩa. Tiêu chí của G-001 (`npm test` exit_zero) xanh suốt cả 13 chặng nên
# không bao giờ phân biệt được tiến bộ với giậm chân; đây là chỗ sửa lỗi đó.
acceptance:
  - id: A-1
    kind: command
    run: "npx tsx --test 'test/scan-guard.test.ts'"
    expect: exit_zero
  - id: A-2
    kind: command
    run: "npx tsx --test 'test/ledger-commit.test.ts'"
    expect: exit_zero

status: active
created_at: 2026-09-01T06:10:00Z
approved_by: "@tienhm"
approved_at: 2026-09-05T13:04:07Z
notes: |-
  KÝ 2026-09-05 bởi @tienhm, bốn ngày sau khi soạn. Nội dung do model soạn
  theo hướng @tienhm chọn trong phiên 2026-09-01; chữ ký là của người, đúng
  luật ở `src/model/goal.ts`.

  Ghi thẳng một điều về THỜI ĐIỂM ký, vì nó đổi cách đọc mục tiêu này: lúc
  soạn (2026-09-01) cả hai tiêu chí đều ĐỎ, và đó là chủ ý. Lúc ký thì cả
  hai đã XANH — T-080 tạo `test/scan-guard.test.ts`, T-081 tạo
  `test/ledger-commit.test.ts`. Nên chữ ký này KHÔNG phải lời hứa sẽ làm;
  nó là xác nhận việc đã làm xong. Mục tiêu đủ điều kiện đóng ngay.

  Nguồn của mục tiêu này là hai chỗ hở đo được, không phải một nguyện vọng:

  1. `test/module-nature.test.ts:105` kết bằng `assert.deepEqual(wrong, [])`.
     Vòng quét không tìm thấy file nào — đổi cấu trúc thư mục, sai glob, `paths`
     rỗng — thì `wrong` rỗng và test XANH mà không chứng minh gì. Không test
     quét nào của ganas hiện có chốt chống rỗng.

  2. `src/verify/ledger.ts:292` chạy `git rev-parse --short HEAD` và ghi kết quả
     vào trường `git` của mỗi dòng sổ cái. Không một dòng nào trong `src/` đọc
     nó ra. Một trường được ghi mà không ai đọc là đúng lớp "lời hứa suông" mà
     `test/no-dead-ends.test.ts` sinh ra để chặn — và nó đã lọt.

  Ý tưởng đến từ repo `mosonlab/anneal` (đọc 2026-09-01), hai chỗ cụ thể:
  `packages/github-client/src/no-child-process.test.ts` có chốt
  `assert.ok(entries.length > 0, "the scan found no source files, so it proved
  nothing")`; và luật bằng chứng gắn commit trong `CONTRIBUTING.md` — "A verdict
  belongs to the exact commit it names — not to an earlier one on the same
  branch, and not to 'the branch'."
