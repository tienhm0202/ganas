id: G-003
title: "Một chặng chạy hết mà người chỉ phải duyệt plan lúc đầu"
outcome: >-
  Sau khi người duyệt xong plan, ganas chạy hết các task của một chặng mà không
  cần người can thiệp giữa chừng — và mỗi lượt giao việc cho sub-agent để lại
  một báo cáo đọc được, gồm cả chỗ worker nói ngược lại đặc tả.

# Hai tiêu chí, cả hai ĐANG ĐỎ tại HEAD hôm nay: hai file test chưa tồn tại.
# Bài học từ G-001 (`npm test` exit_zero xanh suốt 13 chặng nên không phân biệt
# được tiến bộ với giậm chân) — tiêu chí phải đỏ lúc mở thì mới có nghĩa.
acceptance:
  - id: A-1
    kind: command
    run: "npx tsx --test 'test/subagent-report.test.ts'"
    expect: exit_zero
  - id: A-2
