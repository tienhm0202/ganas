notes: |-
  KÝ 2026-09-05 bởi @tienhm, trong chính phiên đã soạn ra mục tiêu này. Nội
  dung do model soạn theo luồng làm việc @tienhm mô tả; chữ ký là của người,
  đúng luật ở `src/model/goal.ts` — model không được tự đặt mục tiêu.

  Hai quyết định @tienhm đã chốt trong phiên đó, ghi lại để chặng dưới không
  phải đoán lại:
  - auto-loop ĐƯỢC commit tự động, message theo conventional commits;
  - loop dừng ở ranh giới HẾT TASK TRONG CÙNG DESIGN, không chạy sang chặng khác.

  Quyết định thứ nhất NGƯỢC với thói quen vẫn dùng trong repo này (luôn hỏi
  người trước khi commit). Ghi lại chỗ ngược đó ở đây để phiên sau không tưởng
  là sơ suất rồi "sửa" lại: đối sách đi kèm là `auto_loop.enabled` mặc định
  `false`, và commit chỉ chạy sau khi gate đã xanh thật.

  Điều mục tiêu này KHÔNG hứa: nó không làm nội dung báo cáo của worker đáng
  tin hơn. ganas kiểm được rằng báo cáo CÓ ba mục phản biện, không kiểm được
  ba mục đó nói thật. Chỗ kiểm thật vẫn là `gate` và sổ cái.

  ĐÓNG 2026-09-05 theo yêu cầu của @tienhm, cùng ngày ký. `approved_by` phía
  trên vẫn là chữ ký lúc MỞ; schema không có `closed_by`, nên người quyết đóng
  ghi ở đây.

  Căn cứ đóng: cả hai tiêu chí đạt — `test/subagent-report.test.ts` 10/10 và
  `test/auto-loop.test.ts` 10/10, đo lúc đóng. Hai chặng phục vụ mục tiêu này
  đều `done`: D-015 (cơ chế) và D-016 (tài liệu).

  GHI THẲNG ĐIỀU MỤC TIÊU NÀY KHÔNG CHỨNG MINH ĐƯỢC, vì nó đổi cách đọc con số
  trên: hai tiêu chí đều là test tự động, chạy trên input giả lập. Không tiêu
  chí nào chứng minh auto-loop đã chạy hết một chặng THẬT trong một phiên Claude
  Code thật — `test/auto-loop.test.ts` dựng input rồi gọi handler, nó không mở
  phiên nào. Ba hành vi harness ở `C-003` vẫn chưa quan sát được, và
  `auto_loop.enabled` vì thế mặc định `false`.

  Nói cách khác: mục tiêu đóng vì cơ chế đã dựng xong và có bằng chứng cơ học,
  KHÔNG phải vì luồng đã được chứng minh chạy trơn ngoài đời. Lần chạy thật đầu
  tiên vẫn còn ở phía trước, và nên có người ngồi xem.
