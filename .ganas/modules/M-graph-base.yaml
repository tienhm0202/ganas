id: M-graph-base
scope: P-graph-core
title: "Nền của đồ thị: kiểu dữ liệu thuần và đường dẫn chuẩn của .ganas/"
nature: code
paths:
  - "src/graph/types.ts"
  - "src/graph/paths.ts"

# Bảng cổng dưới đây do MÁY sinh từ chính chữ ký trong code (T-036):
#
#     node scripts/gen-ports.mjs --scope P-graph-core --print M-graph-base
#
# `portIssues()` so `shape` KHỚP TỪNG KÝ TỰ, nên chép tay vài trăm cổng là chắc
# chắn lệch — sửa chữ ký trong code thì chạy lại lệnh trên rồi dán, đừng gõ tay.
# Kiểu cấu trúc RỘNG khai NHÃN LOẠI (`interface`, `object`, `class`,
# `ZodTypeAny`) thay vì chép nguyên thân: chép nguyên thì mỗi lần thêm một field
# không liên quan cũng làm cạnh đỏ oan, mà cạnh đỏ oan thì lần sau không ai còn
# tin cạnh đỏ nữa.
#
# Khối LÁ tách ra ở T-042 để cắt chu trình M-graph-read ↔ M-load ↔ M-verify
# (PR-013) — nó vẫn không nhập gì từ ba khối đó.
contract:
  inputs:
    # từ M-fsprobe (src/util/fsprobe.ts)
    - name: exists
      shape: "(path: string) => boolean"
    # từ M-model (src/model/config.ts, src/model/design.ts, src/model/goal.ts, src/model/icebox.ts, src/model/knowledge.ts, src/model/module.ts, src/model/proposal.ts, src/model/scope.ts, src/model/task.ts)
    - name: Claim
      shape: "z.infer<typeof zClaim>"
    - name: Config
      shape: "z.infer<typeof zConfig>"
    - name: Decision
      shape: "z.infer<typeof zDecision>"
    - name: Design
      shape: "z.infer<typeof zDesign>"
    - name: Fact
      shape: "z.infer<typeof zFact>"
    - name: Goal
      shape: "z.infer<typeof zGoal>"
    - name: Icebox
      shape: "z.infer<typeof zIcebox>"
    - name: Module
      shape: "z.infer<typeof zModule>"
    - name: Proposal
      shape: "z.infer<typeof zProposal>"
    - name: Scope
      shape: "z.infer<typeof zScope>"
    - name: Task
      shape: "z.infer<typeof zTask>"
    # từ M-util (src/util/errors.ts)
    - name: NotInitializedError
      shape: "class"
  outputs:
    - name: CodeImport
      shape: "{ specifier: string; typeOnly: boolean }"
    - name: CONFIG_FILE
      shape: '"config.yaml"'
    - name: countBySeverity
      shape: "(diags: readonly Diagnostic[]) => Record<Severity, number>"
    - name: Diagnostic
      shape: "interface"
    - name: DIRS
      shape: "object"
    - name: findGanasRoot
      shape: "(from?: string) => string | null"
    - name: GANAS_DIR
      shape: '".ganas"'
    - name: ganasPath
      shape: "(root: string, ...parts: string[]) => string"
    - name: Graph
      shape: "interface"
    - name: LEDGER_FILE
      shape: '"verify-ledger.jsonl"'
    - name: LedgerEntry
      shape: "interface"
    - name: LedgerResult
      shape: "(typeof LEDGER_RESULT)[number]"
    - name: LoadedYaml
      shape: "interface"
    - name: LOCAL_ONLY
      shape: "readonly string[]"
    - name: requireGanasRoot
      shape: "(from?: string) => string"
    - name: Severity
      shape: '"error" | "warning" | "info"'
    - name: Sourced
      shape: "{ value: T; file: string; index?: number }"
    - name: STATE_FILE
      shape: '"state.json"'

depends_on:
  - M-fsprobe
  - M-model
  - M-util
status: surveyed
verify:
  - id: V-graph-base-shape
    kind: probe
    expect: exit_zero
    run: >-
      grep -q "export interface Graph {" src/graph/types.ts &&
      grep -q "export interface Sourced<T> {" src/graph/types.ts &&
      grep -q "export interface LedgerEntry {" src/graph/types.ts &&
      grep -q "export interface LoadedYaml {" src/graph/types.ts &&
      grep -q "export type LedgerResult = (typeof LEDGER_RESULT)\[number\];" src/graph/types.ts &&
      grep -q "export function ganasPath(root: string, ...parts: string\[\]): string {" src/graph/paths.ts &&
      grep -q "export const LEDGER_FILE = \"verify-ledger.jsonl\";" src/graph/paths.ts &&
      ! grep -qE "from \"\.\./(verify|util)/(ledger|yaml)\.js\"" src/graph/types.ts src/graph/paths.ts
  - id: V-graph-base-to-freshness
    kind: contract
    to: M-freshness
    run: >-
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export interface LedgerEntry {" src/graph/types.ts
  - id: V-graph-base-to-graph-read
    kind: contract
    to: M-graph-read
    run: >-
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export type LedgerResult = (typeof LEDGER_RESULT)[number];" src/graph/types.ts &&
      grep -qF "export interface Sourced<T> {" src/graph/types.ts
  - id: V-graph-base-to-load
    kind: contract
    to: M-load
    run: >-
      grep -qF "export interface CodeImport {" src/graph/types.ts &&
      grep -qF "export const CONFIG_FILE = \"config.yaml\";" src/graph/paths.ts &&
      grep -qF "export interface Diagnostic {" src/graph/types.ts &&
      grep -qF "export const DIRS = {" src/graph/paths.ts &&
      grep -qF "export const GANAS_DIR = \".ganas\";" src/graph/paths.ts &&
      grep -qF "export function ganasPath(" src/graph/paths.ts &&
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export interface LoadedYaml {" src/graph/types.ts &&
      grep -qF "export interface Sourced<T> {" src/graph/types.ts
  - id: V-graph-base-to-validate
    kind: contract
    to: M-validate
    run: >-
      grep -qF "export interface Diagnostic {" src/graph/types.ts &&
      grep -qF "export const GANAS_DIR = \".ganas\";" src/graph/paths.ts &&
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export const LEDGER_FILE = \"verify-ledger.jsonl\";" src/graph/paths.ts &&
      grep -qF "export const LOCAL_ONLY: readonly string[] = [\`\${DIRS.runs}/\`, \`\${DIRS.locks}/\`, STATE_FILE];" src/graph/paths.ts &&
      grep -qF "export type Severity = \"error\" | \"warning\" | \"info\";" src/graph/types.ts &&
      grep -qF "export interface Sourced<T> {" src/graph/types.ts
  - id: V-graph-base-to-verify
    kind: contract
    to: M-verify
    run: >-
      grep -qF "export const DIRS = {" src/graph/paths.ts &&
      grep -qF "export function ganasPath(" src/graph/paths.ts &&
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export const LEDGER_FILE = \"verify-ledger.jsonl\";" src/graph/paths.ts &&
      grep -qF "export interface LedgerEntry {" src/graph/types.ts &&
      grep -qF "export type LedgerResult = (typeof LEDGER_RESULT)[number];" src/graph/types.ts &&
      grep -qF "export interface Sourced<T> {" src/graph/types.ts
  - id: V-graph-base-to-claim
    kind: contract
    to: M-claim
    run: >-
      grep -qF "export const DIRS = {" src/graph/paths.ts &&
      grep -qF "export function ganasPath(" src/graph/paths.ts &&
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export const STATE_FILE = \"state.json\";" src/graph/paths.ts
  - id: V-graph-base-to-cli-core
    kind: contract
    to: M-cli-core
    run: >-
      grep -qF "export const DIRS = {" src/graph/paths.ts &&
      grep -qF "export const GANAS_DIR = \".ganas\";" src/graph/paths.ts &&
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export const LEDGER_FILE = \"verify-ledger.jsonl\";" src/graph/paths.ts
  - id: V-graph-base-to-commands
    kind: contract
    to: M-commands
    run: >-
      grep -qF "export const CONFIG_FILE = \"config.yaml\";" src/graph/paths.ts &&
      grep -qF "export function countBySeverity(" src/graph/types.ts &&
      grep -qF "export interface Diagnostic {" src/graph/types.ts &&
      grep -qF "export const DIRS = {" src/graph/paths.ts &&
      grep -qF "export function findGanasRoot(" src/graph/paths.ts &&
      grep -qF "export const GANAS_DIR = \".ganas\";" src/graph/paths.ts &&
      grep -qF "export function ganasPath(" src/graph/paths.ts &&
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export type LedgerResult = (typeof LEDGER_RESULT)[number];" src/graph/types.ts &&
      grep -qF "export function requireGanasRoot(" src/graph/paths.ts &&
      grep -qF "export type Severity = \"error\" | \"warning\" | \"info\";" src/graph/types.ts &&
      grep -qF "export interface Sourced<T> {" src/graph/types.ts &&
      grep -qF "export const STATE_FILE = \"state.json\";" src/graph/paths.ts
  - id: V-graph-base-to-hook-io
    kind: contract
    to: M-hook-io
    run: >-
      grep -qF "export const CONFIG_FILE = \"config.yaml\";" src/graph/paths.ts &&
      grep -qF "export function findGanasRoot(" src/graph/paths.ts &&
      grep -qF "export const GANAS_DIR = \".ganas\";" src/graph/paths.ts &&
      grep -qF "export function ganasPath(" src/graph/paths.ts
  - id: V-graph-base-to-hook-policy
    kind: contract
    to: M-hook-policy
    run: >-
      grep -qF "export const CONFIG_FILE = \"config.yaml\";" src/graph/paths.ts &&
      grep -qF "export interface Diagnostic {" src/graph/types.ts &&
      grep -qF "export const DIRS = {" src/graph/paths.ts &&
      grep -qF "export const GANAS_DIR = \".ganas\";" src/graph/paths.ts &&
      grep -qF "export const LEDGER_FILE = \"verify-ledger.jsonl\";" src/graph/paths.ts
  - id: V-graph-base-to-render
    kind: contract
    to: M-render
    run: >-
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export interface Sourced<T> {" src/graph/types.ts
  - id: V-graph-base-to-templates
    kind: contract
    to: M-templates
    run: >-
      grep -qF "export const LOCAL_ONLY: readonly string[] = [\`\${DIRS.runs}/\`, \`\${DIRS.locks}/\`, STATE_FILE];" src/graph/paths.ts
  - id: V-graph-base-to-workflow
    kind: contract
    to: M-workflow
    run: >-
      grep -qF "export const DIRS = {" src/graph/paths.ts &&
      grep -qF "export function findGanasRoot(" src/graph/paths.ts &&
      grep -qF "export function ganasPath(" src/graph/paths.ts &&
      grep -qF "export interface Graph {" src/graph/types.ts &&
      grep -qF "export interface Sourced<T> {" src/graph/types.ts
