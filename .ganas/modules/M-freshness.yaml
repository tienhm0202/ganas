id: M-freshness
scope: P-graph-core
title: "Độ tươi của bằng chứng: fact còn tin được hay đã hết hạn"
nature: io
paths:
  - "src/graph/freshness.ts"

# Bảng cổng dưới đây do MÁY sinh từ chính chữ ký trong code (T-036):
#
#     node scripts/gen-ports.mjs --scope P-graph-core --print M-freshness
#
# `portIssues()` so `shape` KHỚP TỪNG KÝ TỰ, nên chép tay vài trăm cổng là chắc
# chắn lệch — sửa chữ ký trong code thì chạy lại lệnh trên rồi dán, đừng gõ tay.
# Kiểu cấu trúc RỘNG khai NHÃN LOẠI (`interface`, `object`, `class`,
# `ZodTypeAny`) thay vì chép nguyên thân: chép nguyên thì mỗi lần thêm một field
# không liên quan cũng làm cạnh đỏ oan, mà cạnh đỏ oan thì lần sau không ai còn
# tin cạnh đỏ nữa.
contract:
  inputs:
    # từ M-fsprobe (src/util/fsprobe.ts)
    - name: mtimeMs
      shape: "(path: string) => Promise<number | undefined>"
    # từ M-graph-base (src/graph/types.ts)
    - name: Graph
      shape: "interface"
    - name: LedgerEntry
      shape: "interface"
    # từ M-model (src/model/knowledge.ts)
    - name: Fact
      shape: "z.infer<typeof zFact>"
    - name: Freshness
      shape: "(typeof FRESHNESS)[number]"
    # từ M-util (src/util/glob.ts)
    - name: listProjectFiles
      shape: "(root: string) => Promise<string[]>"
    - name: matchesAny
      shape: "(path: string, patterns: readonly string[]) => boolean"
    # từ M-verify (src/verify/ledger.ts, src/verify/run.ts)
    - name: allTargets
      shape: "(graph: Graph) => Target[]"
    - name: defHash
      shape: "(definition: unknown, statement?: string) => string"
    - name: depsHash
      shape: "(context: string[], root: string, allProjectFiles?: string[]) => Promise<string | undefined>"
    - name: fileHash
      shape: "(path: string) => Promise<string>"
    - name: historyFor
      shape: "(index: Map<string, LedgerEntry[]>, target: string, k?: number) => LedgerEntry[]"
    - name: lastFor
      shape: "(index: Map<string, LedgerEntry[]>, target: string) => LedgerEntry | undefined"
    - name: Target
      shape: "interface"
  outputs:
    - name: computeFreshness
      shape: "(graph: Graph, opts?: { now?: number; }) => Promise<Map<string, VerificationState>>"
    - name: FactFreshness
      shape: "VerificationState"
    - name: freshnessMark
      shape: "(state: VerificationState | undefined) => string"
    - name: VerificationState
      shape: "interface"

depends_on:
  - M-fsprobe
  - M-graph-base
  - M-model
  - M-util
  - M-verify
status: surveyed
verify:
  - id: V-freshness-staleness
    kind: probe
    run: "npx tsx --test 'test/staleness.test.ts'"
    expect: exit_zero
  - id: V-freshness-to-commands
    kind: contract
    to: M-commands
    run: >-
      grep -qF "export async function computeFreshness(" src/graph/freshness.ts &&
      grep -qF "export type FactFreshness = VerificationState;" src/graph/freshness.ts &&
      grep -qF "export function freshnessMark(" src/graph/freshness.ts &&
      grep -qF "export interface VerificationState {" src/graph/freshness.ts
  - id: V-freshness-to-hook-io
    kind: contract
    to: M-hook-io
    run: >-
      grep -qF "export async function computeFreshness(" src/graph/freshness.ts
  - id: V-freshness-to-render
    kind: contract
    to: M-render
    run: >-
      grep -qF "export type FactFreshness = VerificationState;" src/graph/freshness.ts &&
      grep -qF "export function freshnessMark(" src/graph/freshness.ts
  - id: V-freshness-to-workflow
    kind: contract
    to: M-workflow
    run: >-
      grep -qF "export interface VerificationState {" src/graph/freshness.ts
