id: M-freshness
scope: P-graph-core
title: "Độ tươi của bằng chứng: fact còn tin được hay đã hết hạn"
nature: io
paths:
  - "src/graph/freshness.ts"

# `portIssues()` so `name` và `shape` KHỚP TỪNG KÝ TỰ (T-032/T-034). `inputs`
# gộp cổng thật `freshness.ts` import từ hai khối thượng nguồn: `Graph` (kiểu
# đồ thị, từ M-graph-read) và bảy cổng ghi/đọc sổ cái cộng kiểu `Target` (từ
# M-verify) — dùng để duyệt mọi mục tiêu và tính vân tay so độ tươi.
contract:
  inputs:
    - name: Graph
      shape: "interface"
    - name: defHash
      shape: "(definition: unknown, statement?: string) => string"
    - name: fileHash
      shape: "(path: string) => Promise<string>"
    - name: historyFor
      shape: "(index: Map<string, LedgerEntry[]>, target: string, k?: number) => LedgerEntry[]"
    - name: lastFor
      shape: "(index: Map<string, LedgerEntry[]>, target: string) => LedgerEntry | undefined"
    - name: LedgerEntry
      shape: "interface"
    - name: allTargets
      shape: "(graph: Graph) => Target[]"
    - name: depsHash
      shape: "(context: string[], root: string, allProjectFiles?: string[]) => Promise<string | undefined>"
    - name: Target
      shape: "interface"

depends_on:
  - M-graph-read
  - M-verify
status: surveyed
verify:
  - id: V-freshness-staleness
    kind: probe
    run: "npx tsx --test 'test/staleness.test.ts'"
    expect: exit_zero
