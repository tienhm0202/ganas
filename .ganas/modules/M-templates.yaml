id: M-templates
scope: P-cli
title: "Nội dung ganas init sinh ra: config, luật, file hướng dẫn, git hook"
nature: code
paths:
  - "src/templates/**"

# Bảng cổng dưới đây do MÁY sinh từ chính chữ ký trong code (T-037):
#
#     node scripts/gen-ports.mjs --scope P-cli --print M-templates
#
# `portIssues()` so `shape` KHỚP TỪNG KÝ TỰ, nên chép tay vài trăm cổng là chắc
# chắn lệch — sửa chữ ký trong code thì chạy lại lệnh trên rồi dán, đừng gõ tay.
# Kiểu cấu trúc RỘNG khai NHÃN LOẠI (`interface`, `object`, `class`) thay vì chép
# nguyên thân: chép nguyên thì mỗi lần thêm một field không liên quan cũng làm
# cạnh đỏ oan, mà cạnh đỏ oan thì lần sau không ai còn tin cạnh đỏ nữa.
contract:
  inputs:
    # từ M-graph-base (src/graph/paths.ts)
    - name: LOCAL_ONLY
      shape: "readonly string[]"
    # từ M-model (src/model/config.ts)
    - name: guideFileName
      shape: "(harness: Harness) => string"
    - name: Harness
      shape: "(typeof HARNESS)[number]"
  outputs:
    # `commands/init.ts` nạp CẢ MODULE (`import * as T from "../templates/project.js"`).
    # gen-ports.mjs chỉ suy cổng từ import ĐỊNH DANH, nên nó chỉ thấy
    # `moduleGuideMd` (`scope.ts` nhập đích danh) — mười bốn cổng dưới đây khai
    # tay, đúng những tên `init.ts` thật sự gọi.
    - name: InitVars
      shape: "{ project: string; owner?: string | undefined; harness?: Harness | undefined }"
    - name: configYaml
      shape: "(v: InitVars) => string"
    - name: guideMd
      shape: "(v: InitVars) => string"
    - name: knowledgeRuleMd
      shape: "() => string"
    - name: architectureRuleMd
      shape: "() => string"
    - name: guideRuleMd
      shape: "(harness: Harness) => string"
    - name: gitRuleMd
      shape: "() => string"
    - name: namingRuleMd
      shape: "() => string"
    - name: commitMsgHook
      shape: "() => string"
    - name: preCommitHook
      shape: "() => string"
    - name: guidePointerMd
      shape: "(v: InitVars, guide: string) => string"
    - name: gitignoreAddition
      shape: "() => string"
    - name: sampleGoal
      shape: "(id: string, v: InitVars) => string"
    - name: readme
      shape: "() => string"
    - name: moduleGuideMd
      shape: "(v: { id: string; title: string; dir: string; nature: string; probes: readonly string[]; }) => string"

depends_on:
  - M-graph-base
  - M-model
status: surveyed
verify:
  - id: V-templates-init
    kind: probe
    run: "npx tsx --test 'test/init.test.ts'"
    expect: exit_zero
  # Cạnh nội dung → lệnh: `init.ts` dựng project mới từ gần hết export của
  # project.ts, `scope.ts` lấy riêng `moduleGuideMd` để vá file hướng dẫn khối.
  - id: V-templates-to-commands
    kind: contract
    to: M-commands
    run: >-
      grep -q "export function configYaml(v: InitVars): string {" src/templates/project.ts &&
      grep -q "export function readme(): string {" src/templates/project.ts &&
      grep -q "export function moduleGuideMd(v: {" src/templates/project.ts &&
      grep -q "T.configYaml(vars)" src/commands/init.ts &&
      grep -q "moduleGuideMd({" src/commands/scope.ts
