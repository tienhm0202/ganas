id: M-util
scope: P-graph-core
title: "Tiện ích thuần: khớp glob, tách token shell, kiểu lỗi"
nature: code
paths:
  - "src/util/errors.ts"
  - "src/util/glob.ts"
  - "src/util/shell.ts"

# `portIssues()` so `name` và `shape` KHỚP TỪNG KÝ TỰ (T-032/T-034). Khối này
# là NGUỒN của hai cạnh (→ M-fsprobe, → M-verify). `outputs` khai đủ những gì
# `verify/run.ts` và `verify/mutate.ts` thật sự import từ `glob.ts`/`shell.ts`.
#
# Cổng VÀO: `glob.ts` nhập `listDir` từ `M-fsprobe`. Chiều `depends_on` bên dưới
# đã được ĐẢO LẠI ở T-034 cho khớp code — bản cũ (T-019) khai ngược, và cạnh
# giả sinh ra từ chiều sai đó đã bị gỡ.
contract:
  inputs:
    - name: listDir
      shape: "(dir: string) => Promise<DirEntry[]>"
  outputs:
    - name: listProjectFiles
      shape: "(root: string) => Promise<string[]>"
    - name: matchesAny
      shape: "(path: string, patterns: readonly string[]) => boolean"
    - name: looksLikePath
      shape: "(token: string) => boolean"
    - name: stripOperators
      shape: "(token: string) => string"
    - name: tokenSpans
      shape: "(command: string) => TokenSpan[]"
    - name: TokenSpan
      shape: "{ text: string; start: number }"

depends_on:
  - M-fsprobe
status: surveyed
verify:
  - id: V-util-glob
    kind: probe
    run: "npx tsx --test 'test/glob.test.ts'"
    expect: exit_zero
  - id: V-util-to-verify
    kind: contract
    to: M-verify
    run: >-
      grep -q "export async function listProjectFiles(root: string): Promise<string\[\]> {" src/util/glob.ts &&
      grep -q "export function matchesAny(path: string, patterns: readonly string\[\]): boolean {" src/util/glob.ts &&
      grep -q "export function looksLikePath(token: string): boolean {" src/util/shell.ts &&
      grep -q "export function stripOperators(token: string): string {" src/util/shell.ts &&
      grep -q "export function tokenSpans(command: string): TokenSpan\[\] {" src/util/shell.ts &&
      grep -q "export interface TokenSpan {" src/util/shell.ts
