id: M-graph-read
scope: P-graph-core
title: "Đọc đồ thị: chọn task, kiểm cạnh hợp đồng"
nature: code
paths:
  - "src/graph/select.ts"
  - "src/graph/trace.ts"

# T-042 tách `types.ts`/`paths.ts` sang khối lá `M-graph-base` để cắt chu trình
# M-graph-read ↔ M-load ↔ M-verify (PR-013). Cổng ĐI THEO FILE: `Graph`,
# `Sourced`, `ganasPath` và hai cạnh contract của chúng nay nằm ở
# `M-graph-base`, không nhân đôi ở đây.
#
# `portIssues()` so `name` và `shape` KHỚP TỪNG KÝ TỰ (T-032/T-034). `inputs`
# khai đúng ba type mà `select.ts`/`trace.ts` thật sự import từ M-model —
# khai thêm cổng không dùng là nói dối về khối, y như cắt bớt. Khối này không
# là NGUỒN của cạnh khai báo nào nên `outputs` để rỗng.
contract:
  inputs:
    - name: ContractVerification
      shape: "z.infer<typeof zContractVerification>"
    - name: Module
      shape: "z.infer<typeof zModule>"
    - name: Task
      shape: "z.infer<typeof zTask>"

depends_on:
  - M-model
status: surveyed
verify:
  - id: V-graph-read-trace
    kind: probe
    run: "npx tsx --test 'test/trace.test.ts'"
    expect: exit_zero
