id: M-model
scope: P-graph-core
title: "Kiểu dữ liệu lõi của graph (schema Zod)"
nature: code
paths:
  - "src/model/**"

# Bảng cổng dưới đây do MÁY sinh từ chính chữ ký trong code (T-036):
#
#     node scripts/gen-ports.mjs --scope P-graph-core --print M-model
#
# `portIssues()` so `shape` KHỚP TỪNG KÝ TỰ, nên chép tay vài trăm cổng là chắc
# chắn lệch — sửa chữ ký trong code thì chạy lại lệnh trên rồi dán, đừng gõ tay.
# Kiểu cấu trúc RỘNG khai NHÃN LOẠI (`interface`, `object`, `class`,
# `ZodTypeAny`) thay vì chép nguyên thân: chép nguyên thì mỗi lần thêm một field
# không liên quan cũng làm cạnh đỏ oan, mà cạnh đỏ oan thì lần sau không ai còn
# tin cạnh đỏ nữa.
#
# Khối LÁ ở đầu nguồn: không nhập gì từ khối khác, nên chỉ có `outputs`.
contract:
  outputs:
    - name: agentModelAlias
      shape: "(modelId: string) => string | undefined"
    - name: AnchorObject
      shape: "z.infer<typeof zAnchorObject>"
    - name: canDispatchSubagent
      shape: "(harness: Harness) => boolean"
    - name: Claim
      shape: "z.infer<typeof zClaim>"
    - name: Config
      shape: "z.infer<typeof zConfig>"
    - name: ContractVerification
      shape: "z.infer<typeof zContractVerification>"
    - name: Decision
      shape: "z.infer<typeof zDecision>"
    - name: Design
      shape: "z.infer<typeof zDesign>"
    - name: Enforcement
      shape: "(typeof ENFORCEMENT)[number]"
    - name: enforcementFor
      shape: "(config: Config, rule: EnforcementRule) => Enforcement"
    - name: EnforcementRule
      shape: "(typeof ENFORCEMENT_RULES)[number]"
    - name: evalWeakness
      shape: "(v: EvalVerification) => EvalWeakness | null"
    - name: ExitCriterion
      shape: "z.infer<typeof zExitCriterion>"
    - name: Expect
      shape: "z.infer<typeof zExpect>"
    - name: Fact
      shape: "z.infer<typeof zFact>"
    - name: formatAnchor
      shape: "(a: AnchorObject) => string"
    - name: Freshness
      shape: "(typeof FRESHNESS)[number]"
    - name: freshnessOf
      shape: "({ fact, depsChangedAt, now }: FreshnessInput) => Freshness"
    - name: Goal
      shape: "z.infer<typeof zGoal>"
    - name: guideFileName
      shape: "(harness: Harness) => string"
    - name: Harness
      shape: "(typeof HARNESS)[number]"
    - name: HARNESS
      shape: 'readonly ["claude-code", "codex", "cursor", "zed", "windsurf", "gemini", "other"]'
    - name: Icebox
      shape: "z.infer<typeof zIcebox>"
    - name: ID_PATTERNS
      shape: "object"
    - name: LATEST_SCHEMA_VERSION
      shape: "1"
    - name: Module
      shape: "z.infer<typeof zModule>"
    - name: moduleGuideDir
      shape: "(paths: readonly string[]) => string | undefined"
    - name: modulePathsOverlap
      shape: "(a: readonly string[], b: readonly string[]) => boolean"
    - name: pointerFileName
      shape: "(harness: Harness) => string | undefined"
    - name: Proposal
      shape: "z.infer<typeof zProposal>"
    - name: Scope
      shape: "z.infer<typeof zScope>"
    - name: ScoreValue
      shape: "z.infer<typeof zScoreValue>"
    - name: Task
      shape: "z.infer<typeof zTask>"
    - name: Verification
      shape: "z.infer<typeof zVerification>"
    - name: zClaim
      shape: "ZodTypeAny"
    - name: zConfig
      shape: "ZodTypeAny"
    - name: zDecision
      shape: "ZodTypeAny"
    - name: zDesign
      shape: "ZodTypeAny"
    - name: zFact
      shape: "ZodTypeAny"
    - name: zGoal
      shape: "ZodTypeAny"
    - name: zIcebox
      shape: "ZodTypeAny"
    - name: zModule
      shape: "ZodTypeAny"
    - name: zProposal
      shape: "ZodTypeAny"
    - name: zScope
      shape: "ZodTypeAny"
    - name: zTask
      shape: "ZodTypeAny"

status: surveyed
verify:
  - id: V-model-smoke
    kind: probe
    run: "npx tsx --test 'test/icebox-model.test.ts'"
    expect: exit_zero
  - id: V-model-to-cli-core
    kind: contract
    to: M-cli-core
    run: >-
      grep -qF "export type Fact = z.infer<typeof zFact>;" src/model/knowledge.ts &&
      grep -qF "export type Task = z.infer<typeof zTask>;" src/model/task.ts
  - id: V-model-to-commands
    kind: contract
    to: M-commands
    run: >-
      grep -qF "export function formatAnchor(" src/model/anchor.ts &&
      grep -qF "export function guideFileName(" src/model/config.ts &&
      grep -qF "export type Harness = (typeof HARNESS)[number];" src/model/config.ts &&
      grep -qF "export const HARNESS = [" src/model/config.ts &&
      grep -qF "export type Icebox = z.infer<typeof zIcebox>;" src/model/icebox.ts &&
      grep -qF "export const ID_PATTERNS = {" src/model/common.ts &&
      grep -qF "export function moduleGuideDir(" src/model/module.ts &&
      grep -qF "export function pointerFileName(" src/model/config.ts &&
      grep -qF "export type Proposal = z.infer<typeof zProposal>;" src/model/proposal.ts &&
      grep -qF "export type ScoreValue = z.infer<typeof zScoreValue>;" src/model/common.ts &&
      grep -qF "export type Task = z.infer<typeof zTask>;" src/model/task.ts
  - id: V-model-to-exec
    kind: contract
    to: M-exec
    run: >-
      grep -qF "export type Expect = z.infer<typeof zExpect>;" src/model/common.ts
  - id: V-model-to-freshness
    kind: contract
    to: M-freshness
    run: >-
      grep -qF "export type Fact = z.infer<typeof zFact>;" src/model/knowledge.ts &&
      grep -qF "export type Freshness = (typeof FRESHNESS)[number];" src/model/knowledge.ts
  - id: V-model-to-graph-base
    kind: contract
    to: M-graph-base
    run: >-
      grep -qF "export type Claim = z.infer<typeof zClaim>;" src/model/knowledge.ts &&
      grep -qF "export type Config = z.infer<typeof zConfig>;" src/model/config.ts &&
      grep -qF "export type Decision = z.infer<typeof zDecision>;" src/model/knowledge.ts &&
      grep -qF "export type Design = z.infer<typeof zDesign>;" src/model/design.ts &&
      grep -qF "export type Fact = z.infer<typeof zFact>;" src/model/knowledge.ts &&
      grep -qF "export type Goal = z.infer<typeof zGoal>;" src/model/goal.ts &&
      grep -qF "export type Icebox = z.infer<typeof zIcebox>;" src/model/icebox.ts &&
      grep -qF "export type Module = z.infer<typeof zModule>;" src/model/module.ts &&
      grep -qF "export type Proposal = z.infer<typeof zProposal>;" src/model/proposal.ts &&
      grep -qF "export type Scope = z.infer<typeof zScope>;" src/model/scope.ts &&
      grep -qF "export type Task = z.infer<typeof zTask>;" src/model/task.ts
  - id: V-model-to-graph-read
    kind: contract
    to: M-graph-read
    run: >-
      grep -qF "export type ContractVerification = z.infer<typeof zContractVerification>;" src/model/verification.ts &&
      grep -qF "export type Module = z.infer<typeof zModule>;" src/model/module.ts &&
      grep -qF "export type Task = z.infer<typeof zTask>;" src/model/task.ts
  - id: V-model-to-hook-io
    kind: contract
    to: M-hook-io
    run: >-
      grep -qF "export function enforcementFor(" src/model/config.ts
  - id: V-model-to-hook-policy
    kind: contract
    to: M-hook-policy
    run: >-
      grep -qF "export type Enforcement = (typeof ENFORCEMENT)[number];" src/model/config.ts &&
      grep -qF "export type EnforcementRule = (typeof ENFORCEMENT_RULES)[number];" src/model/config.ts
  - id: V-model-to-load
    kind: contract
    to: M-load
    run: >-
      grep -qF "export const LATEST_SCHEMA_VERSION = 1;" src/model/config.ts &&
      grep -qF "export type Module = z.infer<typeof zModule>;" src/model/module.ts &&
      grep -qF "export const zClaim = z" src/model/knowledge.ts &&
      grep -qF "export const zConfig = z.object(" src/model/config.ts &&
      grep -qF "export const zDecision = z" src/model/knowledge.ts &&
      grep -qF "export const zDesign = z" src/model/design.ts &&
      grep -qF "export const zFact = z" src/model/knowledge.ts &&
      grep -qF "export const zGoal = z" src/model/goal.ts &&
      grep -qF "export const zIcebox = z" src/model/icebox.ts &&
      grep -qF "export const zModule = z" src/model/module.ts &&
      grep -qF "export const zProposal = z" src/model/proposal.ts &&
      grep -qF "export const zScope = z" src/model/scope.ts &&
      grep -qF "export const zTask = z" src/model/task.ts
  - id: V-model-to-render
    kind: contract
    to: M-render
    run: >-
      grep -qF "export function agentModelAlias(" src/model/config.ts &&
      grep -qF "export function canDispatchSubagent(" src/model/config.ts &&
      grep -qF "export type Claim = z.infer<typeof zClaim>;" src/model/knowledge.ts &&
      grep -qF "export function enforcementFor(" src/model/config.ts &&
      grep -qF "export function formatAnchor(" src/model/anchor.ts &&
      grep -qF "export type Task = z.infer<typeof zTask>;" src/model/task.ts
  - id: V-model-to-templates
    kind: contract
    to: M-templates
    run: >-
      grep -qF "export function guideFileName(" src/model/config.ts &&
      grep -qF "export type Harness = (typeof HARNESS)[number];" src/model/config.ts
  - id: V-model-to-validate
    kind: contract
    to: M-validate
    run: >-
      grep -qF "export type AnchorObject = z.infer<typeof zAnchorObject>;" src/model/anchor.ts &&
      grep -qF "export function evalWeakness(" src/model/verification.ts &&
      grep -qF "export type ExitCriterion = z.infer<typeof zExitCriterion>;" src/model/task.ts &&
      grep -qF "export function formatAnchor(" src/model/anchor.ts &&
      grep -qF "export function freshnessOf(" src/model/knowledge.ts &&
      grep -qF "export function guideFileName(" src/model/config.ts &&
      grep -qF "export type Icebox = z.infer<typeof zIcebox>;" src/model/icebox.ts &&
      grep -qF "export function moduleGuideDir(" src/model/module.ts &&
      grep -qF "export function modulePathsOverlap(" src/model/module.ts &&
      grep -qF "export type Proposal = z.infer<typeof zProposal>;" src/model/proposal.ts &&
      grep -qF "export type ScoreValue = z.infer<typeof zScoreValue>;" src/model/common.ts
  - id: V-model-to-verify
    kind: contract
    to: M-verify
    run: >-
      grep -qF "export type Expect = z.infer<typeof zExpect>;" src/model/common.ts &&
      grep -qF "export type Fact = z.infer<typeof zFact>;" src/model/knowledge.ts &&
      grep -qF "export type Module = z.infer<typeof zModule>;" src/model/module.ts &&
      grep -qF "export type Scope = z.infer<typeof zScope>;" src/model/scope.ts &&
      grep -qF "export type Verification = z.infer<typeof zVerification>;" src/model/verification.ts
  - id: V-model-to-workflow
    kind: contract
    to: M-workflow
    run: >-
      grep -qF "export type ExitCriterion = z.infer<typeof zExitCriterion>;" src/model/task.ts &&
      grep -qF "export type Icebox = z.infer<typeof zIcebox>;" src/model/icebox.ts &&
      grep -qF "export type Task = z.infer<typeof zTask>;" src/model/task.ts
