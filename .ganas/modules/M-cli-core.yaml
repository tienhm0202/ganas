id: M-cli-core
scope: P-cli
title: "Tính thuần cho lớp lệnh: ranh giới code của task, và tìm fact bằng BM25"
nature: code
paths:
  - "src/boundary.ts"
  - "src/search.ts"
  # Parser tham số: thuần, và thuộc LỚP LỆNH — để ở M-util (P-graph-core) thì
  # một file chỉ CLI dùng lại nằm trong phạm vi đồ thị tri thức.
  - "src/util/args.ts"

# Bảng cổng dưới đây do MÁY sinh từ chính chữ ký trong code (T-037):
#
#     node scripts/gen-ports.mjs --scope P-cli --print M-cli-core
#
# `portIssues()` so `shape` KHỚP TỪNG KÝ TỰ, nên chép tay vài trăm cổng là chắc
# chắn lệch — sửa chữ ký trong code thì chạy lại lệnh trên rồi dán, đừng gõ tay.
# Kiểu cấu trúc RỘNG khai NHÃN LOẠI (`interface`, `object`, `class`) thay vì chép
# nguyên thân: chép nguyên thì mỗi lần thêm một field không liên quan cũng làm
# cạnh đỏ oan, mà cạnh đỏ oan thì lần sau không ai còn tin cạnh đỏ nữa.
# `flow.ts` (M-workflow) nạp `taskBoundary` bằng dynamic import
# (`await import("./boundary.js")`), không phải import tĩnh — gen-ports.mjs chỉ
# đọc import TĨNH nên cạnh đó nó KHÔNG thấy; cạnh vẫn có thật, xem
# V-cli-core-to-workflow.
contract:
  inputs:
    # từ M-claim (src/state.ts)
    - name: TOUCHED_PATHS_CAP
      shape: "200"
    # từ M-graph-base (src/graph/paths.ts, src/graph/types.ts)
    - name: DIRS
      shape: "object"
    - name: GANAS_DIR
      shape: '".ganas"'
    - name: Graph
      shape: "interface"
    - name: LEDGER_FILE
      shape: '"verify-ledger.jsonl"'
    # từ M-model (src/model/knowledge.ts, src/model/task.ts)
    - name: Fact
      shape: "z.infer<typeof zFact>"
    - name: Task
      shape: "z.infer<typeof zTask>"
    # từ M-util (src/util/glob.ts, src/util/shell.ts)
    - name: looksLikePath
      shape: "(token: string) => boolean"
    - name: matchesAny
      shape: "(path: string, patterns: readonly string[]) => boolean"
    - name: stripOperators
      shape: "(token: string) => string"
    - name: tokenizeShell
      shape: "(command: string) => string[]"
  outputs:
    - name: Argv
      shape: "interface"
    - name: contractPathRefs
      shape: "(task: Task) => ContractPathRef[]"
    - name: enabled
      shape: "(argv: Argv, ...names: string[]) => boolean"
    - name: flag
      shape: "(argv: Argv, ...names: string[]) => boolean"
    - name: formatBoundaryWarning
      shape: "(taskId: string, boundary: readonly string[], touched: readonly string[], outside: readonly string[]) => string"
    - name: formatDispatchWarning
      shape: '(taskId: string, tier: Task["model"], subagentTouched: boolean) => string'
    - name: multiOption
      shape: "(argv: Argv, ...names: string[]) => string[]"
    - name: option
      shape: "(argv: Argv, ...names: string[]) => string | undefined"
    - name: outsideBoundary
      shape: "(task: Task, graph: Graph, touched: readonly string[]) => string[]"
    - name: ownsGanasFile
      shape: "(task: Task, relPath: string) => boolean"
    - name: parseArgs
      shape: "(raw: string[], booleanFlags?: Iterable<string>) => Argv"
    - name: searchFacts
      shape: "(graph: Graph, query: string, opts?: SearchOptions) => SearchHit[]"
    - name: SearchHit
      shape: "interface"
    - name: taskBoundary
      shape: "(task: Task, graph: Graph) => string[]"
    - name: taskQuery
      shape: "(task: Task) => string"

depends_on:
  - M-claim
  - M-graph-base
  - M-model
  - M-util
status: surveyed
verify:
  - id: V-cli-core-boundary
    kind: probe
    run: "npx tsx --test 'test/boundary.test.ts'"
    expect: exit_zero
  # Hai bằng chứng RIÊNG, không gộp một lệnh hai pattern: `ganas verify` bóp méo
  # từng chuỗi để kiểm probe có thật sự kiểm gì không, và một lệnh hai pattern
  # thì bóp méo pattern đầu vẫn pass nhờ pattern sau — probe rỗng ruột.
  - id: V-cli-core-search
    kind: probe
    run: "npx tsx --test 'test/search.test.ts'"
    expect: exit_zero
  # Cạnh cốt lõi → vỏ workflow: `flowContext` (src/flow.ts) hỏi
  # `taskBoundary` để tính pathspec `git status` — qua dynamic import, nên
  # kiểm cả khai báo thật ở nguồn lẫn chỗ gọi động ở đích.
  - id: V-cli-core-to-workflow
    kind: contract
    to: M-workflow
    run: >-
      grep -q "export function taskBoundary(task: Task, graph: Graph): string\[\]" src/boundary.ts &&
      grep -q 'await import("./boundary.js")' src/flow.ts
  # Cạnh sinh ra khi `search.ts` chuyển sang khối này (T-021) — `brief.ts` vẫn
  # gọi nó, chỉ là cạnh trong bản đồ trỏ nhầm khối cũ tới tận T-033.
  - id: V-cli-core-to-render
    kind: contract
    to: M-render
    run: >-
      grep -q "export function searchFacts(" src/search.ts &&
      grep -q "export function taskQuery(" src/search.ts
