id: M-load
scope: P-graph-core
title: "Nạp YAML thành graph"
nature: io
paths:
  - "src/graph/load.ts"
  - "src/util/yaml.ts"

# Bảng cổng dưới đây do MÁY sinh từ chính chữ ký trong code (T-036):
#
#     node scripts/gen-ports.mjs --scope P-graph-core --print M-load
#
# `portIssues()` so `shape` KHỚP TỪNG KÝ TỰ, nên chép tay vài trăm cổng là chắc
# chắn lệch — sửa chữ ký trong code thì chạy lại lệnh trên rồi dán, đừng gõ tay.
# Kiểu cấu trúc RỘNG khai NHÃN LOẠI (`interface`, `object`, `class`,
# `ZodTypeAny`) thay vì chép nguyên thân: chép nguyên thì mỗi lần thêm một field
# không liên quan cũng làm cạnh đỏ oan, mà cạnh đỏ oan thì lần sau không ai còn
# tin cạnh đỏ nữa.
contract:
  inputs:
    # từ M-graph-base (src/graph/paths.ts, src/graph/types.ts)
    - name: CodeImport
      shape: "{ specifier: string; typeOnly: boolean }"
    - name: CONFIG_FILE
      shape: '"config.yaml"'
    - name: Diagnostic
      shape: "interface"
    - name: DIRS
      shape: "object"
    - name: GANAS_DIR
      shape: '".ganas"'
    - name: ganasPath
      shape: "(root: string, ...parts: string[]) => string"
    - name: Graph
      shape: "interface"
    - name: LoadedYaml
      shape: "interface"
    - name: Sourced
      shape: "{ value: T; file: string; index?: number }"
    # từ M-model (src/model/config.ts, src/model/design.ts, src/model/goal.ts, src/model/icebox.ts, src/model/knowledge.ts, src/model/module.ts, src/model/proposal.ts, src/model/scope.ts, src/model/task.ts)
    - name: LATEST_SCHEMA_VERSION
      shape: "1"
    - name: Module
      shape: "z.infer<typeof zModule>"
    - name: zClaim
      shape: "ZodTypeAny"
    - name: zConfig
      shape: "ZodTypeAny"
    - name: zDecision
      shape: "ZodTypeAny"
    - name: zDesign
      shape: "ZodTypeAny"
    - name: zFact
      shape: "ZodTypeAny"
    - name: zGoal
      shape: "ZodTypeAny"
    - name: zIcebox
      shape: "ZodTypeAny"
    - name: zModule
      shape: "ZodTypeAny"
    - name: zProposal
      shape: "ZodTypeAny"
    - name: zScope
      shape: "ZodTypeAny"
    - name: zTask
      shape: "ZodTypeAny"
    # từ M-util (src/util/errors.ts, src/util/glob.ts)
    - name: GanasError
      shape: "class"
    - name: matchesAny
      shape: "(path: string, patterns: readonly string[]) => boolean"
    # từ M-verify (src/verify/ledger.ts)
    - name: indexByTarget
      shape: "(entries: readonly LedgerEntry[]) => Map<string, LedgerEntry[]>"
    - name: readLedger
      shape: "(root: string) => Promise<LedgerEntry[]>"
  outputs:
    - name: lineOfPath
      shape: "(loaded: LoadedYaml, path: readonly (string | number)[]) => number | undefined"

depends_on:
  - M-graph-base
  - M-model
  - M-util
  - M-verify
status: surveyed
verify:
  - id: V-load-smoke
    kind: probe
    run: "npx tsx --test 'test/knowledge.test.ts'"
    expect: exit_zero
  - id: V-load-to-validate
    kind: contract
    to: M-validate
    run: >-
      grep -qF "export function lineOfPath(" src/util/yaml.ts
