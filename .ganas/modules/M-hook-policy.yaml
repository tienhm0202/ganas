id: M-hook-policy
scope: P-hook
title: "Phán quyết của hook: chặn hay cho qua, và nói gì với người"
nature: code
paths:
  - "src/hooks/policy/**"

# `portIssues()` so `name` và so `shape` KHỚP TỪNG KÝ TỰ, và từ T-032 mỗi cạnh
# chỉ chịu trách nhiệm cho cổng CHÍNH NÓ cấp. Nên khai ở đây phải là chữ ký
# THẬT: đổi chữ ký trong code mà quên sửa dòng này thì cạnh đỏ — đó là toàn bộ
# giá trị. Khai chung chung ("kết quả", "dữ liệu") biến cạnh thành ô đã điền.
#
# Bảng dưới do MÁY sinh từ chữ ký thật, không chép tay:
#   node scripts/gen-ports.mjs --scope P-hook
contract:
  inputs:
    # từ M-graph-base (src/graph/paths.ts, src/graph/types.ts)
    - name: CONFIG_FILE
      shape: '"config.yaml"'
    - name: Diagnostic
      shape: "interface"
    - name: DIRS
      shape: "object"
    - name: GANAS_DIR
      shape: '".ganas"'
    - name: LEDGER_FILE
      shape: '"verify-ledger.jsonl"'
    # từ M-model (src/model/config.ts)
    - name: Enforcement
      shape: "(typeof ENFORCEMENT)[number]"
    - name: EnforcementRule
      shape: "(typeof ENFORCEMENT_RULES)[number]"
  outputs:
    - name: ALLOW
      shape: "HookOutput"
    - name: applyEnforcement
      shape: "(mode: Enforcement, body: string) => HookOutput"
    - name: decideEntityOverwrite
      shape: "(exists: boolean) => WriteStep"
    - name: decideProposalWrite
      shape: "(mode: Enforcement) => HookOutput"
    - name: decideWriteEarly
      shape: "(t: WriteTarget) => WriteStep"
    - name: denyPreTool
      shape: "(reason: string) => HookOutput"
    - name: DISPATCH_NUDGE_REASON
      shape: "string"
    - name: HookInput
      shape: "interface"
    - name: HookOutput
      shape: "interface"
    - name: inRepoTree
      shape: "(rel: string | undefined) => rel is string"
    - name: knowledgeWriteBody
      shape: "(rel: string, diags: readonly Diagnostic[], rule: EnforcementRule, nudgeTail: string) => string"
    - name: locate
      shape: "(raw: string, cwd: string, root: string) => { abs: string; rel: string }"
    - name: PLAN_APPROVED_REASON
      shape: "string"
    - name: ruleForDiagnostics
      shape: "(diags: readonly Diagnostic[]) => EnforcementRule"
    - name: shellLooksLikeWrite
      shape: "(command: string) => boolean"
    - name: WRITE_TOOLS
      shape: "Set<string>"

# Hai cạnh này XUYÊN PHẠM VI: nguồn nằm trong P-graph-core, nên đầu kia
# (`contract.outputs` của M-graph-base / M-model, cộng bằng chứng
# `kind: contract`) phải do chính phạm vi đó khai. T-038 chỉ khai được đầu ĐÍCH.
depends_on:
  - M-graph-base
  - M-model

status: surveyed
verify:
  - id: V-hook-policy-pure
    kind: probe
    run: "npx tsx --test 'test/hook-policy.test.ts'"
    expect: exit_zero
  # Cạnh lõi → vỏ, ranh giới mà PR-004 dựng ra. `run` phải nhắc TÊN CỔNG, nếu
  # không `lintProbe` báo probe-unrelated — và báo đúng, vì lệnh chung chung
  # không kiểm riêng cạnh này. Ở đây nó khẳng định ba chữ ký quyết định còn
  # nguyên văn trong code, tức bắt được lúc YAML và code trôi khỏi nhau.
  - id: V-hook-policy-to-io
    kind: contract
    to: M-hook-io
    run: >-
      grep -q "export function decideWriteEarly(t: WriteTarget): WriteStep" src/hooks/policy/index.ts &&
      grep -q "export function decideEntityOverwrite(exists: boolean): WriteStep" src/hooks/policy/index.ts &&
      grep -q "export function decideProposalWrite(mode: Enforcement): HookOutput" src/hooks/policy/index.ts
